/* ------------------------------ 링크로 돌아왔을 때 ------------------------------ */
/* Supabase 는 메일 링크를 누르면 #access_token=...&refresh_token=...&type=... 로 돌려보낸다 */
function cloudParseAuthHash(hash) {
  var out = { type: '', access: '', refresh: '', error: '', desc: '' };
  var s = String(hash || '');
  if (s.charAt(0) === '#') s = s.slice(1);
  if (!s) return out;
  s.split('&').forEach(function (pair) {
    var i = pair.indexOf('=');
    if (i < 0) return;
    var k = decodeURIComponent(pair.slice(0, i));
    var v = decodeURIComponent(pair.slice(i + 1).replace(/\+/g, ' '));
    if (k === 'access_token') out.access = v;
    else if (k === 'refresh_token') out.refresh = v;
    else if (k === 'type') out.type = v;
    else if (k === 'error') out.error = v;
    else if (k === 'error_description') out.desc = v;
  });
  return out;
}
async function cloudHandleHash() {
  if (typeof window === 'undefined' || !window.location) return false;
  var hash = '';
  try { hash = window.location.hash || ''; } catch (e) { return false; }
  if (!hash || hash.length < 10) return false;
  var p = cloudParseAuthHash(hash);
  if (!p.access || !p.refresh) {
    if (p.error || p.desc) {
      toast('링크를 열지 못했어요: ' + (p.desc || p.error));
      cloudClearHash();
      return true;
    }
    return false;
  }
  cloudAdoptSession({ access_token: p.access, refresh_token: p.refresh, expires_in: 0 });
  /* expires_in 이 없는 링크라 만료 시각을 알 수 없다 — 바로 refresh 해 둔다 */
  await cloudToken();
  cloudClearHash();
  cloudUpdateBadge();
  if (p.type === 'recovery') {
    cloudResetSheet();
    return true;
  }
  toast('로그인했어요 · ' + (cloudEmail() || ''));
  await cloudAfterLogin(false);
  return true;
}
function cloudClearHash() {
  try {
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  } catch (e) { /* ignore */ }
}

/* ------------------------------ 이벤트 · 초기화 ------------------------------ */
function cloudOnClick(e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var v = el.getAttribute('data-v');
  if (act.indexOf('cloud') !== 0 && act !== 'account') return;
  switch (act) {
    case 'account':
      if (cloudSignedIn()) openSettings();
      else cloudAuthSheet('in');
      break;
    case 'cloud-auth': _cloudMsg = null; _cloudForm.password = ''; cloudAuthSheet('in'); break;
    case 'cloud-tab': _cloudMsg = null; cloudAuthSheet(v); break;
    case 'cloud-submit': cloudDoAuth(); break;
    case 'cloud-forgot': _cloudMsg = null; cloudEmailSheet('forgot'); break;
    case 'cloud-otp': _cloudMsg = null; cloudEmailSheet('otp'); break;
    case 'cloud-email-send': cloudDoEmailSend(v || 'otp'); break;
    case 'cloud-reset-save': cloudDoResetSave(); break;
    case 'cloud-close': closeSheet(); break;
    case 'cloud-sync':
      toast('동기화하는 중이에요.');
      cloudSync().then(function (ok) {
        if (ok) toast('동기화했어요.');
        else if (cloudStatus() === 'setup') toast('클라우드 설정 대기 중이에요. SQL을 먼저 실행해 주세요.');
        else if (cloudStatus() === 'conflict') toast('어느 기록을 남길지 골라 주세요.');
        else toast('동기화하지 못했어요. 잠시 후 다시 시도해 주세요.');
      });
      break;
    case 'cloud-signout':
      cloudSignOut().then(function () {
        toast('로그아웃했어요. 기록은 이 기기에 그대로 있어요.');
        cloudRefreshSettings();
      });
      break;
    case 'cloud-upload-local':
      confirmSheet('이 기기 기록 올리기', '클라우드에 있는 이 계정의 기록을 이 기기 기록으로 바꿉니다.', '올리기', false, function () {
        closeSheet();
        cloudPush().then(function (ok) {
          toast(ok ? '이 기기 기록을 계정에 올렸어요.' : '올리지 못했어요. 잠시 후 다시 시도해 주세요.');
          cloudRefreshSettings();
        });
      });
      break;
    case 'cloud-pull':
      confirmSheet('클라우드에서 불러오기', '이 기기의 기록을 계정에 저장된 기록으로 바꿉니다. 아직 올리지 않은 이 기기의 변경은 사라져요.', '불러오기', false, function () {
        closeSheet();
        cloudPull().then(function (ok) {
          toast(ok ? '계정의 기록을 불러왔어요.' : '불러올 기록이 없거나 실패했어요.');
          cloudRefreshSettings();
        });
      });
      break;
    case 'cloud-take-remote':
      closeSheet();
      cloudPull().then(function (ok) {
        toast(ok ? '클라우드 기록을 불러왔어요.' : '불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
        cloudRefreshSettings();
      });
      break;
    case 'cloud-take-local':
      closeSheet();
      cloudPush().then(function (ok) {
        toast(ok ? '이 기기 기록을 올렸어요.' : '올리지 못했어요. 잠시 후 다시 시도해 주세요.');
        cloudRefreshSettings();
      });
      break;
  }
}
/* 입력값은 화면을 다시 그려도 남게 여기에 모아 둔다 */
function cloudOnInput(e) {
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var key = t.getAttribute('data-cloud');
  if (!key) return;
  _cloudForm[key] = t.value;
}
function cloudOnKey(e) {
  var t = e.target;
  if (!t || !t.getAttribute || !t.getAttribute('data-cloud')) return;
  if (e.key !== 'Enter') return;
  var act = document.querySelector('.sheet [data-act="cloud-submit"], .sheet [data-act="cloud-email-send"], .sheet [data-act="cloud-reset-save"]');
  if (act && act.click) act.click();
}
function cloudInit() {
  if (_cloudBoot) return;
  _cloudBoot = true;
  if (typeof document === 'undefined' || !document.addEventListener) return;
  document.addEventListener('click', cloudOnClick);
  document.addEventListener('input', cloudOnInput);
  document.addEventListener('keydown', cloudOnKey);
  cloudMetaRead();
  cloudUpdateBadge();
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', function () {
      if (cloudReady() && cloudMetaRead().dirtyAt) cloudSync(true);
    });
  }
  /* 메일 링크로 돌아온 경우 — 재설정이면 새 비밀번호 화면을 바로 연다 */
  cloudHandleHash().then(function (handled) {
    if (handled) return;
    if (!cloudReady()) return;
    var m = cloudMetaRead();
    m.email = cloudEmail();
    cloudMetaWrite();
    cloudUpdateBadge();
    if (typeof setTimeout !== 'undefined') setTimeout(function () { cloudSync(true); }, 1200);
  }).catch(function () { /* ignore */ });
}

/* ------------------------------ 저장 훅 ------------------------------ */
/* 앱이 기록을 저장할 때마다(saveState) 클라우드에도 곧 반영한다(1.4초 디바운스). */
if (typeof saveState === 'function') {
  var _cloudSaveState = saveState;
  saveState = function () {
    var ok = _cloudSaveState.apply(null, arguments);
    if (ok) {
      try { cloudMarkDirty(); } catch (e) { /* 동기화 표시 실패는 저장을 막지 않는다 */ }
    }
    return ok;
  };
}

if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cloudInit);
  else cloudInit();
}

if (typeof __TEST__ !== 'undefined') {
  __TEST__.cloudPayload = cloudPayload;
  __TEST__.cloudPhotoRefOnly = cloudPhotoRefOnly;
  __TEST__.cloudIsEmail = cloudIsEmail;
  __TEST__.cloudParseAuthHash = cloudParseAuthHash;
  __TEST__.cloudStatusText = cloudStatusText;
  __TEST__.cloudSettingsHtml = cloudSettingsHtml;
  __TEST__.cloudRedirect = cloudRedirect;
  __TEST__.cloudAuthFailMessage = cloudAuthFailMessage;
}

   · 한국어 원문은 노드에 기억해 두었다가 한국어로 돌아오면 그대로 복원한다.
