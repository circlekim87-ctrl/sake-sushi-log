<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사케 노트">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="사케 노트 — 스시·사케 기록 앱 데모. 업장·기록·사진은 모두 예시 데이터입니다.">
<meta name="robots" content="noindex,nofollow">
<title>사케 노트 · 스시·사케 기록 (데모)</title>
<style>
:root{
  --bg:#F4F2EC; --bg2:#EAE7DE; --card:#FFFFFF; --ink:#1A1D22; --ink2:#4B5057;
  --muted:#8E9298; --line:#E7E3DA; --line2:#F0EDE6;
  --navy:#1B2430; --navy2:#2C3846; --gold:#A5854F; --gold-soft:#F5EFE2; --gold-line:#E9DCC3;
  --danger:#B0473E; --r:18px;
  --shadow:0 1px 2px rgba(26,29,34,.04), 0 10px 26px -18px rgba(26,29,34,.35);
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  --serif:"AppleMyungjo","Nanum Myeongjo","Iowan Old Style",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden;font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(130% 55% at 50% -5%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font-size:16px}
img{display:block}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 11px) 16px 10px;background:rgba(244,242,236,.82);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .25s}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mark{width:31px;height:31px;flex:0 0 31px;border-radius:9px;background:var(--navy);color:#F7F2E6;
  display:grid;place-items:center;font-family:var(--serif);font-size:18px;line-height:1;padding-bottom:1px}
.brand h1{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--muted);font-weight:650;text-transform:uppercase;margin-top:1px}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid var(--line);background:rgba(255,255,255,.66);transition:.15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}

main{padding:4px 16px calc(100px + var(--safe-b));outline:0}
body[data-tab="grid"] main{padding-bottom:calc(168px + var(--safe-b))}
body[data-tab="grid"] .actionbar{display:block}
.view{animation:fade .24s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- headings ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:12px 2px 13px}
.vh h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.035em}
.vh p{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:-.01em}
.vh .side{font-size:11.5px;color:var(--muted);padding-bottom:3px;white-space:nowrap}
.mlabel{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;font-size:11px;letter-spacing:.13em;
  color:var(--muted);font-weight:700;text-transform:uppercase}
.mlabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 0;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{text-align:center;position:relative}
.stats div+div::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--line2)}
.stats b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stats span{font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 2px 11px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink2);
  font-size:12.5px;padding:7px 12px;border-radius:999px;font-weight:560;transition:.16s;letter-spacing:-.01em}
.chip.on{background:var(--navy);border-color:var(--navy);color:#F8F5EC}
.chip.mini{font-size:11.5px;padding:6px 10px}

/* ---------- visit card ---------- */
.vcard{display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;box-shadow:var(--shadow);margin-bottom:11px;transition:transform .13s}
.vcard:active{transform:scale(.993)}
.vrow{display:flex;align-items:flex-start;gap:10px}
.dbadge{width:46px;flex:0 0 46px;text-align:center;border-right:1px solid var(--line2);padding-right:7px}
.dbadge b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.04em}
.dbadge span{font-size:10px;color:var(--muted);letter-spacing:.08em}
.vmeta{flex:1;min-width:0;padding-top:1px}
.vname{font-size:15.5px;font-weight:660;letter-spacing:-.025em;display:flex;gap:6px;align-items:center}
.vsub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dot{width:2.5px;height:2.5px;border-radius:50%;background:#C9C4B8;display:inline-block}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.strip .th{position:relative;aspect-ratio:1;max-height:132px;border-radius:9px;overflow:hidden;background:var(--bg2)}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .more{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(18,20,24,.5);color:#fff;display:grid;place-items:center;
  font-size:12.5px;font-weight:650;letter-spacing:-.02em}
.sakeline{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.stag{font-size:11px;color:#6E5A36;background:var(--gold-soft);border:1px solid var(--gold-line);
  padding:3px 8px;border-radius:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.snote{margin-top:8px;font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:2px 5px;border-radius:5px;
  background:#EEF0F2;color:#5C646E;vertical-align:1px;white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:#7A6238}

/* ---------- sake card ---------- */
.ncard{display:flex;gap:11px;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform .13s}
.ncard:active{transform:scale(.993)}
.nthumb{width:56px;height:56px;flex:0 0 56px;border-radius:11px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(150deg,#EFECE3,#DFD9CB);font-family:var(--serif);font-size:22px;color:#9C8F76}
.nthumb img{width:100%;height:100%;object-fit:cover}
.nbody{flex:1;min-width:0}
.nname{font-size:14.5px;font-weight:660;letter-spacing:-.025em;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nsub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{position:relative;display:inline-block;color:#DDD7C9;font-size:11px;letter-spacing:1.4px;line-height:1;height:12px;margin-top:3px}
.stars i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);font-style:normal}
.nmemo{font-size:12px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.linkchip{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10.5px;color:#5A6470;
  background:#F1F3F5;border-radius:6px;padding:3px 7px;letter-spacing:-.01em}
.linkchip svg{width:11px;height:11px}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#B3B6BA}

/* ---------- cards / forms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 11px;font-size:13px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .side{margin-left:auto;font-size:11px;color:var(--muted);font-weight:550}
.stepnum{width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;
  display:grid;place-items:center;font-weight:700;padding-bottom:1px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border:1.5px dashed #D9D3C5;
  border-radius:14px;color:var(--muted);font-size:12.5px;background:#FBFAF5;text-align:center;width:100%}
.drop svg{width:26px;height:26px;color:#B4AC9A;margin-bottom:2px}
.drop b{color:var(--ink);font-size:14px;font-weight:640;letter-spacing:-.02em}
.drop input{display:none}
.phlist{margin-top:4px}
.phrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.phrow:last-child{border-bottom:0}
.pth{width:50px;height:50px;flex:0 0 50px;border-radius:9px;object-fit:cover;background:var(--bg2)}
.phinfo{flex:1;min-width:0;font-size:11.5px;color:var(--muted)}
.phinfo b{display:block;font-size:13px;color:var(--ink);font-weight:600;letter-spacing:-.02em;margin-bottom:1px}
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);border:1px solid var(--line);
  border-radius:999px;padding:5px 9px;background:#fff;white-space:nowrap;font-weight:560}
.toggle.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;font-weight:600}
.input{width:100%;min-height:44px;border:1px solid var(--line);background:#FCFBF7;border-radius:10px;padding:10px 12px;
  outline:0;transition:.16s}
.input:focus{border-color:#C3BCA9;background:#fff;box-shadow:0 0 0 3px rgba(165,133,79,.1)}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
select.input{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E9298' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:15px;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:11px 14px;
  font-size:13.5px;font-weight:620;border:1px solid var(--line);background:#fff;color:var(--ink);
  letter-spacing:-.01em;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#F9F6EE;border-color:var(--navy)}
.btn.ghost{background:#FBFAF5}
.btn.danger{color:var(--danger);border-color:#EBD9D6;background:#FDF7F6}
.btn.block{width:100%}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4}
.btn svg{width:15px;height:15px}
.hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.hint b{color:var(--ink2);font-weight:600}

/* ---------- grid tab ---------- */
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pool .cell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--bg2);width:100%}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .pick{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.92);background:rgba(18,20,24,.26);display:grid;place-items:center;
  color:#fff;font-size:10.5px;font-weight:700;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.cell.sel .pick{background:var(--gold);border-color:#fff}
.cell.sel::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border:2px solid var(--gold);border-radius:9px;pointer-events:none}
.cell .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:9px;color:#fff;
  background:linear-gradient(to top,rgba(12,14,18,.75),rgba(12,14,18,0));white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.actionbar{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));padding:9px 16px 10px;z-index:25;
  background:linear-gradient(to top,rgba(244,242,236,.99),rgba(244,242,236,.82) 65%,rgba(244,242,236,0));
  pointer-events:none}
.actionbar .inner{max-width:460px;margin:0 auto;pointer-events:auto}
.previewBox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.previewBox img{width:100%;height:auto}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(250,248,243,.93);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 7px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:#9A9EA4;
  font-size:10px;font-weight:650;letter-spacing:.01em;transition:color .16s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab .recicon{width:33px;height:33px;border-radius:50%;background:var(--navy);color:#F8F5ED;display:grid;
  place-items:center;margin-top:-8px;box-shadow:0 7px 16px -7px rgba(27,36,48,.75);transition:.16s}
.tab .recicon svg{width:19px;height:19px}
.tab.rec.on .recicon{background:var(--gold)}
.tab.rec span.lbl{margin-top:1px}

/* ---------- sheets ---------- */
.sheetwrap{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(16,18,22,.44);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:460px;max-height:92vh;max-height:92dvh;background:var(--bg);
  border-radius:22px 22px 0 0;box-shadow:0 -24px 44px -24px rgba(0,0,0,.45);display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.handle{width:38px;height:4px;border-radius:99px;background:#D7D1C4;margin:9px auto 3px;flex:0 0 auto}
.sheethead{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheethead h3{margin:0;font-size:15px;font-weight:700;flex:1;letter-spacing:-.025em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{overflow:auto;padding:14px 16px calc(26px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheetbody.tight{padding:0 0 calc(26px + var(--safe-b))}

/* ---------- detail ---------- */
.hero{position:relative;aspect-ratio:5/4;background:var(--bg2);overflow:hidden;margin:0}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;inset:auto 0 0 0;padding:52px 16px 14px;color:#fff;
  background:linear-gradient(to top,rgba(10,12,16,.86),rgba(10,12,16,0))}
.hero .cap b{font-size:19px;font-weight:680;letter-spacing:-.03em;display:block}
.hero .cap span{display:block;font-size:11.5px;opacity:.85;margin-top:3px}
.dt{margin-top:14px}
.dt h4{margin:16px 2px 8px;font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700;text-transform:uppercase}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photoGrid .ph{aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--bg2)}
.photoGrid .ph img{width:100%;height:100%;object-fit:cover}
.srow{display:flex;gap:9px;align-items:center;padding:9px 11px;background:#fff;border:1px solid var(--line);
  border-radius:11px;margin-bottom:6px;width:100%}
.srow .sn{flex:1;min-width:0}
.srow .sn b{display:block;font-size:13.5px;font-weight:620;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn span{font-size:11px;color:var(--muted)}
.srow .st{color:var(--gold);font-size:11px;letter-spacing:1.2px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.kv>div{background:#fff;padding:9px 11px}
.kv dt{font-size:10.5px;color:var(--muted);margin:0 0 2px;letter-spacing:.02em}
.kv dd{margin:0;font-size:13.5px;font-weight:560;letter-spacing:-.02em}
.noteBox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;
  color:var(--ink2);white-space:pre-wrap;line-height:1.55}
.rateRow{display:flex;gap:4px;align-items:center}
.rateRow button{font-size:26px;line-height:1;color:#DED8CA;transition:.12s}
.rateRow button.on{color:var(--gold)}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:90;background:#0C0E11;display:flex;flex-direction:column;
  animation:fade .16s ease both}
.lightbox .lbTop{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 10px) 14px 8px;color:#D8D4CA;font-size:12px}
.lightbox .lbStage{flex:1;display:grid;place-items:center;padding:0 6px;min-height:0}
.lightbox .lbStage img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .lbBottom{display:flex;justify-content:space-between;gap:10px;padding:10px 16px calc(18px + var(--safe-b))}
.lightbox .lbBottom button{color:#EDE9DF;font-size:22px;padding:4px 14px}

h4{margin:16px 2px 8px;font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700;text-transform:uppercase}
h4.dt{margin-top:16px}

/* ---------- misc ---------- */
.empty{text-align:center;padding:38px 18px;color:var(--muted);font-size:12.5px;line-height:1.6}
.empty .big{font-family:var(--serif);font-size:28px;color:#CFC7B6;margin-bottom:9px;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,14px);
  background:rgba(24,27,32,.95);color:#F6F3EC;font-size:12.5px;padding:10px 15px;border-radius:11px;z-index:100;
  opacity:0;transition:.24s;pointer-events:none;max-width:86vw;text-align:center;line-height:1.45;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sep{height:1px;background:var(--line);margin:12px -14px}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.pill{font-size:10.5px;font-weight:650;color:#6E5A36;background:var(--gold-soft);border:1px solid var(--gold-line);
  padding:2px 7px;border-radius:6px}
.pill.dark{background:#EDEFF1;border-color:#E2E5E8;color:#5C646E}
.loader{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* --- iOS Safari 날짜·시간 입력칸이 카드 밖으로 넘치지 않게 --- */
.grid2 > *{min-width:0}
.grid2 .field{min-width:0}
input[type="date"],input[type="time"]{
  min-width:0;width:100%;max-width:100%;box-sizing:border-box;display:block;text-align:left;
}
input[type="date"]::-webkit-datetime-edit,
input[type="time"]::-webkit-datetime-edit{min-width:0;max-width:100%;overflow:hidden}
input[type="date"]::-webkit-date-and-time-value,
input[type="time"]::-webkit-date-and-time-value{min-width:0;text-align:left}
@media (max-width:360px){
  input[type="date"],input[type="time"]{font-size:14px;padding-left:10px;padding-right:8px}
}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   사케 노트 — 스시 · 사케 기록 (프로토타입)
   단일 파일 모바일 웹앱. 데이터는 브라우저 localStorage에만 저장됩니다.
   ===================================================================== */

/* ------------------------------ utils ------------------------------ */
var DB_KEY = 'sakeSushiLog.demo.v1';
var APP_VERSION = '0.2.1';

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
var _seq = 0;
function uid(p) {
  _seq += 1;
  return (p || 'id') + Date.now().toString(36).slice(-5) + _seq.toString(36) +
    Math.random().toString(36).slice(2, 6);
}
function toYmd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayYmd() { return toYmd(new Date()); }
function fromYmd(s) {
  var p = String(s || '').split('-');
  if (p.length < 3) return new Date();
  return new Date(+p[0], (+p[1]) - 1, +p[2], 12, 0, 0);
}
var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
function fmtDot(s) { return s ? String(s).replace(/-/g, '.') : ''; }
function fmtKo(s) {
  if (!s) return '';
  var d = fromYmd(s);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
}
function fmtMonth(s) {
  var d = fromYmd(s);
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
}
function dayNum(s) { return String(parseInt(String(s).slice(8, 10), 10)); }
function weekdayOf(s) { return WEEK[fromYmd(s).getDay()]; }
function hm(iso) {
  if (!iso) return '';
  var m = String(iso).match(/T(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : '';
}
function num(v) { return (v === null || v === undefined || v === '') ? null : Number(v); }
function round1(n) { return Math.round(n * 10) / 10; }
function haversine(a, b) {
  if (!a || !b) return null;
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  var la1 = a.lat * rad, la2 = b.lat * rad;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(h))));
}
function distLabel(m) {
  if (m == null) return '';
  return m < 1000 ? m + 'm' : round1(m / 1000) + 'km';
}
function starsHtml(rating) {
  var r = Number(rating) || 0;
  if (r <= 0) return '<span class="stars">★★★★★<i style="width:0%">★★★★★</i></span>';
  var w = Math.max(0, Math.min(100, (r / 5) * 100));
  return '<span class="stars">★★★★★<i style="width:' + w + '%">★★★★★</i></span>';
}
function starsText(rating) { return Number(rating) ? Number(rating).toFixed(1).replace(/\.0$/, '') : ''; }

function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
}

/* ------------------------------ sheet ------------------------------ */
var _sheet = null, _sheetClose = null;
function openSheet(inner, onClose) {
  closeSheet(true);
  var layer = document.getElementById('layer');
  if (!layer) return;
  var wrap = document.createElement('div');
  wrap.className = 'sheetwrap';
  wrap.innerHTML = '<div class="scrim" data-act="close-sheet"></div>' +
    '<div class="sheet"><div class="handle"></div>' + inner + '</div>';
  layer.appendChild(wrap);
  _sheet = wrap;
  _sheetClose = onClose || null;
  document.body.style.overflow = 'hidden';
}
function closeSheet(silent) {
  if (_sheet) { _sheet.remove(); _sheet = null; }
  if (!document.querySelector('.lightbox') && !document.querySelector('.sheetwrap')) {
    document.body.style.overflow = '';
  }
  var cb = _sheetClose; _sheetClose = null;
  if (cb && !silent) cb();
}
function sheetHead(title, rightHtml) {
  return '<div class="sheethead"><h3>' + esc(title) + '</h3>' + (rightHtml || '') +

  else if (ui.tab === 'notes') main.innerHTML = viewNotes();
  else if (ui.tab === 'record') main.innerHTML = viewRecord();
  else main.innerHTML = viewGrid();
  if (_lastTab !== ui.tab) { window.scrollTo(0, 0); _lastTab = ui.tab; }
}

function emptyBlock(big, small) {

/* ------------------------------ 업장별 ------------------------------ */

}
function statsBlock(visits) {

/* ------------------------------ 사케 목록 ------------------------------ */
function gradeChips() {
  var present = {};
  state.sakes.forEach(function (s) { present[s.grade || '기타'] = (present[s.grade || '기타'] || 0) + 1; });
  var out = '<button class="chip' + (ui.gradeFilter === 'all' ? ' on' : '') + '" data-act="grade-filter" data-v="all">전체 ' + state.sakes.length + '</button>';
  GRADES.forEach(function (g) {
    if (!present[g]) return;
    out += '<button class="chip' + (ui.gradeFilter === g ? ' on' : '') + '" data-act="grade-filter" data-v="' + esc(g) + '">' + esc(g) + '</button>';
  });
  return out;
}
function sortChips() {
  var opts = [['recent', '최근순'], ['rating', '별점순'], ['name', '이름순']];
  return opts.map(function (o) {
    return '<button class="chip mini' + (ui.noteSort === o[0] ? ' on' : '') + '" data-act="note-sort" data-v="' + o[0] + '">' + o[1] + '</button>';
  }).join('');
}
function filteredSakes() {
  var q = (ui.noteQuery || '').trim().toLowerCase();
  var arr = state.sakes.slice();
  if (ui.gradeFilter !== 'all') {
    arr = arr.filter(function (s) { return (s.grade || '기타') === ui.gradeFilter; });
  }
  if (q) {
    arr = arr.filter(function (s) {
      var visit = s.visitId ? visitById(s.visitId) : null;
      var venue = visit ? venueById(visit.venueId) : null;
      var hay = [s.name, s.brewery, s.rice, s.memo, s.grade, venue ? venue.name : ''].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  if (ui.noteSort === 'rating') arr.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
  else if (ui.noteSort === 'name') arr.sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || ''), 'ko'); });
  else arr.sort(function (a, b) {
    var va = a.visitId ? visitById(a.visitId) : null, vb = b.visitId ? visitById(b.visitId) : null;
    return ((vb ? vb.date : '') + (vb ? vb.time : '')).localeCompare((va ? va.date : '') + (va ? va.time : ''));
  });
  return arr;
}
function sakeMeta(s) {

}
function sakeCard(s) {

  };
}
function photoRows(rec) {

function venueSuggestions(rec) {
  var items = [];
  if (rec.lat != null && rec.lng != null) {
    state.venues.forEach(function (v) {
      if (typeof v.lat !== 'number' || typeof v.lng !== 'number') return;
      var d = haversine({ lat: rec.lat, lng: rec.lng }, { lat: v.lat, lng: v.lng });
      if (d != null && d <= 600) items.push({ v: v, d: d });
    });
    items.sort(function (a, b) { return a.d - b.d; });

    (rec.lat != null ? '이 위치 근처 업장' : '최근 업장') + '</div><div class="chips" style="padding-bottom:0">';
  items.forEach(function (it) {
    h += '<button class="chip' + (rec.venueId === it.v.id ? ' on' : '') + '" data-act="rec-venue-pick" data-id="' + it.v.id + '">' +
      esc(it.v.name) + (it.d != null ? ' <span style="opacity:.55">' + distLabel(it.d) + '</span>' : '') + '</button>';
  });

}
function findAttachTarget(rec) {

    ' style="width:17px;height:17px;flex:0 0 17px;accent-color:#1B2430">' +

    '<div class="field"><label>주조미</label><input class="input" data-f="rice" value="' + esc(d.rice) + '" placeholder="예) 야마다니시키"></div></div>';

/* ------------------------------ 격자 ------------------------------ */
function gridPool() {
  var seen = {}, out = [];
  allPhotos().forEach(function (p) {
    if (seen[p.src]) return;
    seen[p.src] = 1;
    out.push(p);

  return toYmd(t) + 'T' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ':00';
}
function median(arr) {
  var a = arr.slice().sort(function (x, y) { return x - y; });
  if (!a.length) return 0;
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function syncRecordForm() {

function syncDrafts() {

  });

function refreshRecSuggestions() {
  var rec = ui.rec;
  if (!rec || !rec.photos.length) return;
  var counts = {}, best = '', bestN = 0;
  rec.photos.forEach(function (p) {
    if (!p.taken) return;
    var d = p.taken.slice(0, 10);
    counts[d] = (counts[d] || 0) + 1;
    if (counts[d] > bestN) { bestN = counts[d]; best = d; }
  });
  if (best) rec.date = best;
  var first = rec.photos.filter(function (p) { return p.taken; })[0];
  if (first && !rec.time) rec.time = hm(first.taken);
  var gps = rec.photos.filter(function (p) { return p.gps; }).map(function (p) { return p.gps; });
  if (gps.length) {
    rec.lat = Math.round(median(gps.map(function (g) { return g.lat; })) * 1e5) / 1e5;
    rec.lng = Math.round(median(gps.map(function (g) { return g.lng; })) * 1e5) / 1e5;
    if (typeof nearbyReinferOnMove === 'function') nearbyReinferOnMove(rec);
    if (!rec.venueName) {
      var near = nearestVenue(rec.lat, rec.lng, nearbyRadiusM());
      if (near) {
        rec.venueName = near.venue.name;
        rec.venueId = near.venue.id;
        rec.area = near.venue.area || '';
        rec.autoVenue = true;   // 자동으로 채운 값(사진을 더하면 다시 판단)
      } else {
        startNearbyLookup(rec);
      }
    }
  }
  if (!rec.attachVisitId) {
    var t = findAttachTarget(rec);
    if (t) rec.attachVisitId = t.id;
  }
}
async function addRecordFiles(files) {
  if (!files || !files.length) return;
  var rec = ui.rec || (ui.rec = newRecord());
  // 데모: '샘플로 체험'한 기록에 내 사진을 고르면 샘플 사진·사케 초안은 먼저 비운다
  // (샘플 좌표가 남아 GPS 중앙값이 샘플 업장에 머무는 일을 막는다)
  if (rec.photos.length && rec.photos.every(function (p) {
        return String(p.src || '').indexOf('seed:') === 0; })) {
    rec.photos = [];
    rec.sakes = rec.sakes.filter(function (d) {
      return !d.photoId; });
  }
  var ok = 0, noExif = 0, failed = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (f.type && f.type.indexOf('image/') !== 0) continue;
    try {
      var buf = await readAsArrayBuffer(f);
      var ex = buf ? parseExif(buf) : { date: null, lat: null, lng: null };
      var raw = await readAsDataUrl(f);
      var small = await shrink(raw, 1400, 0.7);
      if (!ex.date) noExif++;
      rec.photos.push({
        id: uid('p'), src: small, taken: ex.date || fileTime(f),
        gps: (ex.lat != null && ex.lng != null) ? { lat: ex.lat, lng: ex.lng } : null,
        isLabel: false
      });
      ok++;
    } catch (err) { failed++; }
  }
  if (ok) {
    refreshRecSuggestions();
    render();
    toast('사진 ' + ok + '장 추가' + (noExif ? ' · EXIF 없는 ' + noExif + '장은 파일 시각 사용' : ''));
  } else if (failed) {
    toast('사진을 열지 못했어요. 아이폰 HEIC라면 설정 › 카메라 › 포맷을 "높은 호환성"으로 바꿔 주세요.');
  }

async function callVision(mediaType, b64) {
  var s = state.settings;
  var prompt = '이 사진은 일본 사케 병의 라벨입니다. 읽을 수 있는 정보만 골라 JSON 하나로만 답하세요. 모르면 빈 문자열. ' +
    '형식: {"name":"","brewery":"","grade":"준마이다이긴죠|준마이긴죠|준마이|혼조조|긴죠|다이긴죠|특별준마이|샴페인|기타","polish":"정미보합 숫자","rice":"주조미","hiire":"hiire|namachozo|nama|yamahai","abv":"도수 숫자","memo":"한 줄 메모"}';
  var res, json, text;
  if (s.provider === 'openai') {
    res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey.trim() },
      body: JSON.stringify({
        model: (s.model || 'gpt-4o-mini').trim(),
        max_tokens: 400,
        messages: [{
          role: 'user', content: [
            { type: 'text', text: prompt },
            { type: 'image_url', image_url: { url: 'data:' + mediaType + ';base64,' + b64 } }
          ]
        }]
      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    json = await res.json();
    text = (json.choices && json.choices[0] && json.choices[0].message.content) || '';
  } else {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': s.apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: (s.model || 'claude-3-5-haiku-latest').trim(),
        max_tokens: 400,
        messages: [{
          role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    json = await res.json();
    text = (json.content || []).map(function (c) { return c.text || ''; }).join('');
  }
  var mm = String(text).match(/\{[\s\S]*\}/);
  return JSON.parse(mm ? mm[0] : text);
}

function drawCell(ctx, img, x, y, size) {
  var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, size, size);
  ctx.clip();
  /* 1) 여백은 같은 사진을 흐리게 깔아 채운다 (무크롭) */
  var tmp = document.createElement('canvas');
  tmp.width = 32; tmp.height = 32;
  var tc = tmp.getContext('2d');
  var cover = Math.max(32 / iw, 32 / ih);
  tc.drawImage(img, (32 - iw * cover) / 2, (32 - ih * cover) / 2, iw * cover, ih * cover);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tmp, 0, 0, 32, 32, x, y, size, size);
  /* 2) 원본 비율 유지, 잘림 없이 중앙 배치 */
  var k = Math.min(size / iw, size / ih);
  var dw = iw * k, dh = ih * k;
  ctx.drawImage(img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
  ctx.restore();
}
async function composeGrid() {
  var g = ui.grid;
  var n = g.layout === 9 ? 3 : 2;
  if (g.sel.length !== g.layout) return;
  var size = g.size, gap = g.gap;
  var canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  var cell = (size - gap * (n + 1)) / n;
  var imgs = [];
  for (var i = 0; i < g.sel.length; i++) {
    imgs.push(await loadImage(photoSrc(g.sel[i])));
  }
  for (var j = 0; j < imgs.length; j++) {
    var col = j % n, row = Math.floor(j / n);
    var x = gap + col * (cell + gap);
    var y = gap + row * (cell + gap);
    drawCell(ctx, imgs[j], x, y, cell);
  }
  g.last = {
    jpg: canvas.toDataURL('image/jpeg', 0.92),
    canvas: canvas,
    size: size,
    name: 'sake_grid_' + todayYmd().replace(/-/g, '') + '_' + g.layout
  };
  openGridPreview();
}

function addPhotosToVisit(files, visitId) {

/* =====================================================================
   위치 기반 업장 추론 — 사진 EXIF 좌표로 '처음 가는 업장' 후보 찾기
   ---------------------------------------------------------------------
   · 이미 방문한 업장은 기존 기능이 먼저 처리한다(설정한 조회 반경과 같은 기준).
   · 그 밖의 위치는 아래 순서로 주변 업장 후보를 조회한다.
       1) 설정에 카카오 로컬 REST 키가 있으면 카카오 로컬(음식점 FD6, 설정 반경)
       2) 키가 없거나 카카오가 실패하면 OpenStreetMap
          - Overpass API : 설정 반경의 음식점·바·이자카야 등 POI
          - Nominatim    : 역지오코딩(accept-language=ko)으로 동네명
   · 기본 조회 반경은 5m (설정 › 위치 · 업장 추론에서 5 / 20 / 50 / 100m).
     실내 GPS 오차로 0건이면 한 번에 30m로 넓혀 찾는 버튼을 보여 준다.
   · 모든 조회는 비동기이며 실패·타임아웃·오프라인이어도 수동 입력을 막지 않는다.
   · 외부로 나가는 값은 사진의 좌표뿐이다(사진·기록·개인정보는 보내지 않음).
   · 로딩은 어떤 경우에도 끝난다:
       개별 요청 4초(AbortController + setTimeout) · 한 번의 조회 전체 6.5초 ·
       안전망 8초(watchdog). 응답이 끝내 오지 않아도 로딩 상태를 강제로 닫는다.
   · 결과가 없는 좌표를 '찾는 중'으로 계속 그리지 않는다. 자동 조회가 예정되지
     않은 상태면 바로 누를 수 있는 안내([주변 업장 찾기])를 보여 준다.
   · 사진을 더하거나 빼서 GPS 중앙값이 바뀌면, 앞서 잡아 둔 업장의 좌표가 설정
     반경 밖일 때 그 연결을 푼다(해제 판정은 GPS 오차를 감안해 하한 50m).
     자동으로 채운 이름·지역·주소는 함께 비우고, 직접 입력·선택한 이름은 남긴다.
   · 업장이 이미 정해진 기록에서도 ③ 업장 카드 아래 [이 위치 주변 업장 다시 찾기]
     버튼으로 추천 영역을 언제든 다시 연다.
   · 역지오코딩한 동네명은 ② 촬영 정보의 위치 줄에도 함께 보여 준다(좌표별 캐시).
   ===================================================================== */
var NEARBY_RADIUS_DEFAULT = 5;
var NEARBY_RADIUS_OPTIONS = [5, 20, 50, 100];
var OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
var NOMINATIM_REVERSE = 'https://nominatim.openstreetmap.org/reverse';
var KAKAO_CATEGORY = 'https://dapi.kakao.com/v2/local/search/category.json';
/* 시간 상한 — 느리거나 막힌 네트워크에서도 '찾는 중'이 남지 않게 한다 */
var NEARBY_REQUEST_MS = 4000;      // 개별 요청(Overpass·Nominatim·카카오) 하나의 상한
var NEARBY_TOTAL_MS = 6500;        // 한 번의 조회 전체 상한(역지오코딩 포함)
var NEARBY_WATCHDOG_MS = 8000;     // 프라미스가 끝내 안 끝날 때 로딩을 강제로 닫는 안전망

/* 이미 잡아 둔 업장 연결을 풀 때의 하한(m).
   매칭은 설정 반경(기본 5m) 그대로지만, 해제까지 5m로 하면 실내 GPS 오차로
   사진 한 장만 더 넣어도 방금 잡힌 업장이 풀린다. 다른 동네(수백 m~수 km)로
   옮겨 간 경우만 풀리도록 하한을 둔다. 설정 반경이 더 넓으면 그 값을 따른다. */
var NEARBY_CLEAR_MIN_M = 50;

var _nearbySeq = 0;        // 조회 세대 — 늦게 도착한 응답이 새 상태를 덮지 않게 한다
var _nearbyLastNom = 0;    // Nominatim 마지막 요청 시각(간격 유지)
var _nearbyPending = '';   // 화면 렌더에서 예약만 된 조회의 좌표 키

function nearbyKey(lat, lng) {

  r = Number(r);

/* ------------------------------ fetch util ------------------------------ */
/* AbortController + setTimeout 타임아웃.
   AbortSignal.timeout() 같은 최신 API는 쓰지 않는다(iOS 구버전 Safari 호환).
   브라우저가 금지하는 헤더(User-Agent·Referer 등)는 넣지 않는다.
   응답 본문 파싱이 멈춰도 타이머가 프라미스를 반드시 정리한다. */
function fetchWithTimeout(url, opt, ms) {
  // 개별 요청은 인자와 상관없이 NEARBY_REQUEST_MS(4초)를 넘지 않는다
  var limit = Math.max(300, Math.min(Number(ms) > 0 ? Number(ms) : NEARBY_REQUEST_MS, NEARBY_REQUEST_MS));
  var src = opt || {};
  var req = { method: src.method || 'GET' };
  if (src.headers) req.headers = src.headers;
  if (src.body != null) req.body = src.body;
  return new Promise(function (resolve, reject) {
    var settled = false, ctrl = null, timer = null;
    function finish(fn, arg) {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      try { fn(arg); } catch (e) { /* noop */ }
    }
    if (typeof AbortController === 'function') {
      try { ctrl = new AbortController(); req.signal = ctrl.signal; } catch (e) { ctrl = null; }
    }
    timer = setTimeout(function () {
      finish(reject, new Error('timeout'));
      try { if (ctrl) ctrl.abort(); } catch (e) { /* noop */ }
    }, limit);
    var p;
    try {
      p = fetch(url, req);
    } catch (e) {
      finish(reject, e || new Error('network'));
      return;
    }
    if (!p || typeof p.then !== 'function') { finish(reject, new Error('fetch unsupported')); return; }
    p.then(function (res) {
      if (!res) throw new Error('network');
      if (res.status >= 400) throw new Error('http ' + res.status);
      return res.text();
    }).then(function (text) {
      var data = null;
      if (text) {
        try { data = JSON.parse(text); } catch (e) { throw new Error('bad json'); }
      }
      finish(resolve, data);
    }).catch(function (err) {
      finish(reject, err || new Error('network'));
    });
  });
}
/* 여러 조회 중 하나라도 결과가 나오면 기다리지 않고 바로 반환한다.
   모두 끝나면 합쳐서 반환(0건 포함). 막힌 미러가 느릴 때 대기 시간을 줄인다. */
function nearbyFirst(promises) {
  return new Promise(function (resolve) {
    var n = promises.length, done = 0, out = [], settled = false;
    function finish() { if (settled) return; settled = true; resolve(out); }
    if (!n) { resolve(out); return; }
    promises.forEach(function (p) {
      p.then(function (list) {
        done++;
        if (list && list.length) { out = out.concat(list); finish(); return; }
        if (done === n) finish();
      }, function () {
        done++;
        if (done === n) finish();
      });
    });
  });
}
/* 남은 예산 안에서만 기다린다 — 지역명 같은 부가 정보가 로딩을 붙잡지 않게 */
function nearbyRace(promise, ms) {
  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, Math.max(50, Number(ms) || 0));
    promise.then(function (v) {
      if (done) return;
      done = true; clearTimeout(timer); resolve(v);
    }, function () {
      if (done) return;
      done = true; clearTimeout(timer); resolve(null);
    });
  });
}
/* Nominatim 공공 API 는 초당 1회 이하를 요구한다. 역지오코딩과 검색이 겹치지 않게
   간격을 지키되, 기다리는 시간이 남은 예산을 넘지 않게 자른다. */
function nominatimGate(ms) {
  var budget = Number(ms) > 0 ? Number(ms) : NEARBY_REQUEST_MS;
  var now = Date.now();
  var gap = (_nearbyLastNom > 0) ? (_nearbyLastNom + NEARBY_NOMINATIM_GAP_MS - now) : 0;
  if (gap < 0) gap = 0;
  var cap = Math.max(0, budget - 300);
  if (gap > cap) gap = cap;
  _nearbyLastNom = now + gap;
  return gap > 0 ? wait(gap) : Promise.resolve();
}

function fetchKakao(lat, lng, key, radius, ms) {

function scheduleNearbyLookup(rec) {
  if (!rec || rec.lat == null || rec.lng == null) return;
  if (rec.venueId && !rec.nearbyOpen) return;   // 접어 둔 기록은 사용자가 열 때만 찾는다
  if (typeof setTimeout !== 'function') return;   // 브라우저 밖(정적 검사 환경)
  if (!nearbyHasNetwork()) return;
  var key = nearbyKey(rec.lat, rec.lng);
  if (_nearby.key === key || _nearbyPending === key) return;
  _nearbyPending = key;
  setTimeout(function () {
    if (_nearbyPending === key) _nearbyPending = '';
    if (ui.rec !== rec) return;
    if (rec.lat == null || rec.lng == null) return;
    if (nearbyKey(rec.lat, rec.lng) !== key) return;
    if (_nearby.key === key) return;
    startNearbyLookup(rec);
  }, 0);
}
function retryNearby() {
  var rec = ui.rec;
  if (!rec || rec.lat == null) return;
  startNearbyLookup(rec, { force: true });
}
/* 0건일 때: 설정 반경에서 한 단계 넓혀(기본 5m → 30m) 바로 다시 찾는다 */
function nearbyWiden() {
  var rec = ui.rec;
  if (!rec || rec.lat == null || rec.lng == null) return;
  var cur = (_nearby.key === nearbyKey(rec.lat, rec.lng) && _nearby.radius)
    ? _nearby.radius : nearbyRadiusM();
  var target = nearbyWidenTarget(cur);
  startNearbyLookup(rec, { radius: target, widen: true, force: true });
  toast('반경 ' + target + 'm로 넓혀 찾는 중…');
}
/* 설정에서 기본 조회 반경을 바꿨을 때: 캐시를 비우고 열린 기록이 있으면 새 반경으로 다시 조회 */
function nearbyOnRadiusChange() {
  var rec = ui.rec;
  nearbyResetState();
  var r = nearbyRadiusM();
  if (rec && rec.lat != null && rec.lng != null) startNearbyLookup(rec, { force: true });
  else refreshNearbyUI();
  toast('업장 조회 반경을 ' + r + 'm로 바꿨어요');
}

/* ------------------------------ view ------------------------------ */
function nearbyBlock(rec) {
  if (!rec || rec.lat == null || rec.lng == null) return '';
  // 이미 내 업장과 매칭된 기록: 추천 영역은 접어 두되 작은 버튼으로 언제든 다시 연다
  if (rec.venueId && !rec.nearbyOpen) {
    var known = (typeof venueById === 'function') ? venueById(rec.venueId) : null;
    return '<div id="nearbyToggle" style="margin:2px 0 10px">' +
      '<button class="btn sm ghost" data-act="nearby-open" style="padding:5px 9px;font-size:11.5px">' +
      '이 위치 주변 업장 다시 찾기</button>' +
      '<span class="tiny" style="margin-left:6px;opacity:.6">' +
      (known ? esc(known.name) + ' 선택됨' : '업장 선택됨') + '</span></div>';
  }
  // 상태가 없는 좌표면 자동 조회를 예약한다(렌더 도중에 쏘지 않도록 setTimeout 0)
  scheduleNearbyLookup(rec);
  return '<div id="nearbyBox" style="margin:2px 0 10px">' + nearbyBoxInner(rec) + '</div>';
}
function nearbyBoxInner(rec) {
  var n = nearbyState();
  var radius = (n && n.radius) ? n.radius : nearbyRadiusM();
  var h = '<div class="row" style="margin-bottom:4px;gap:6px;align-items:baseline">' +
    '<span class="tiny" style="color:var(--ink2);font-weight:700;letter-spacing:.02em">이 위치 근처 추천 업장</span>' +
    '<span class="spacer"></span>' +
    (n && n.src ? '<span class="tiny" style="opacity:.6">' + esc(n.src) + '</span>' : '') +
    (rec && rec.venueId && rec.nearbyOpen
      ? '<button class="btn sm ghost" data-act="nearby-close" style="padding:2px 7px;font-size:10.5px;margin-left:4px">접기</button>'
      : '') + '</div>';
  h += '<div class="tiny" style="opacity:.65;margin-bottom:5px">' +
    (n && n.area ? esc(n.area) + ' · ' : '') + '반경 ' + radius + 'm' +
    (n && n.widened ? ' · 넓혀 찾음' : '') + '</div>';
  if (!n) {
    // 이 좌표의 조회 상태가 없다. 자동 조회가 예약돼 있으면 '찾는 중',
    // 아니면 영원한 로딩 대신 바로 누를 수 있는 안내를 보여 준다.
    var pending = (rec && rec.lat != null) ? (_nearbyPending === nearbyKey(rec.lat, rec.lng)) : false;
    if (pending) {
      h += '<div class="tiny" style="opacity:.75">주변 업장을 찾는 중…</div>';
      h += '<div class="tiny" style="opacity:.6;margin-top:3px">기다리지 말고 이름·지역·주소를 직접 입력해도 돼요.</div>';
      return h;
    }
    h += '<div class="tiny" style="opacity:.78;line-height:1.7">주변 업장을 아직 찾지 않았어요.' +
      ' <button class="btn sm ghost" data-act="nearby-retry" style="padding:4px 8px;font-size:11px">주변 업장 찾기</button>' +
      '<br>이름은 직접 입력해도 돼요.</div>';
    return h;
  }
  if (n.loading) {
    h += '<div class="tiny" style="opacity:.75">주변 업장을 찾는 중…</div>';
    h += '<div class="tiny" style="opacity:.6;margin-top:3px">기다리지 말고 이름·지역·주소를 직접 입력해도 돼요.</div>';
    return h;
  }
  if (!n.places.length) {
    if (n.error === 'network' || n.error === 'offline') {
      var why = (n.error === 'offline')
        ? '오프라인이라 주변 업장을 조회하지 못했어요.'
        : '주변 업장을 조회하지 못했어요.';
      h += '<div class="tiny" style="opacity:.75">' + why + ' 이름을 직접 입력해 주세요.' +
        ' <button class="btn sm ghost" data-act="nearby-retry" style="margin-left:4px;padding:4px 8px;font-size:11px">다시 찾기</button>' +
        '</div>';
      return h;
    }
    var next = nearbyWidenTarget(radius);
    h += '<div class="tiny" style="opacity:.78;line-height:1.7">반경 ' + radius + 'm 내에 등록된 업장이 없어요.' +
      ' <button class="btn sm ghost" data-act="nearby-widen" style="padding:4px 8px;font-size:11px">' +
      next + 'm로 넓혀 찾기</button>' +
      ' <button class="btn sm ghost" data-act="nearby-retry" style="padding:4px 8px;font-size:11px">다시 찾기</button>' +
      '<br>이름은 직접 입력해도 돼요.</div>';
    return h;
  }
  h += '<div class="chips" style="padding-bottom:0">';
  n.places.forEach(function (p, i) {
    var on = rec && rec.venueName && rec.venueName === p.name;
    var kind = (p.kind && p.kind !== '음식점' && String(p.name).indexOf(p.kind) < 0) ? p.kind : '';
    h += '<button class="chip' + (on ? ' on' : '') + '" data-act="nearby-pick" data-i="' + i + '">' +
      esc(p.name) +
      (kind ? ' <span style="opacity:.5">' + esc(kind) + '</span>' : '') +
      (p.dist != null ? ' <span style="opacity:.55">' + distLabel(p.dist) + '</span>' : '') +
      '</button>';
  });
  h += '</div>';
  h += '<div class="tiny" style="margin-top:5px;opacity:.65">누르면 업장명 · 지역' +
    (n.address ? ' · 주소' : '') + '가 채워져요</div>';
  return h;
}
function refreshNearbyUI() {
  var box = document.getElementById('nearbyBox');
  if (box && ui.rec) { box.innerHTML = nearbyBoxInner(ui.rec); return; }
  if (ui.tab === 'record') render();
}

/* ------------------------------ pick ------------------------------ */
function nearbyPick(i) {
  var rec = ui.rec;
  var n = nearbyState();
  if (!rec || !n) return;
  var p = n.places[i];
  if (!p) return;
  if (typeof syncRecordForm === 'function') syncRecordForm();
  rec.venueName = p.name;
  rec.area = p.area || n.area || '';
  rec.address = p.address || n.address || '';
  var known = state.venues.filter(function (v) { return v.name === p.name; })[0] || null;
  rec.venueId = known ? known.id : '';
  rec.autoVenue = false;            // 직접 고른 이름은 사진을 더해도 자동으로 비우지 않는다
  rec.nearbyOpen = false;           // 업장이 정해지면 추천 영역은 접는다
  if (known) {
    if (!rec.area) rec.area = known.area || '';
    if (!rec.address) rec.address = known.address || '';
  }
  if (typeof p.lat === 'number' && typeof p.lng === 'number') {
    rec.venueLat = p.lat;
    rec.venueLng = p.lng;
  }
  var t = (typeof findAttachTarget === 'function') ? findAttachTarget(rec) : null;
  rec.attachVisitId = t ? t.id : '';
  render();
  toast(p.name + ' · 업장 정보를 채웠어요');
}

/* 테스트용 노출 (앱 동작과 무관) */
if (typeof __TEST__ !== 'undefined') {
  __TEST__.nearbyKey = nearbyKey;
  __TEST__.nearbyRadiusM = nearbyRadiusM;
  __TEST__.nearbyWidenTarget = nearbyWidenTarget;
  __TEST__.nearbyBlock = nearbyBlock;
  __TEST__.nearbyBoxInner = nearbyBoxInner;
  __TEST__.nearbyPick = nearbyPick;
  __TEST__.nearbyMerge = nearbyMerge;
  __TEST__.startNearbyLookup = startNearbyLookup;
  __TEST__.retryNearby = retryNearby;
  __TEST__.nearbyWiden = nearbyWiden;
  __TEST__.nearbyOnRadiusChange = nearbyOnRadiusChange;
  __TEST__.nearbyResetState = nearbyResetState;
  __TEST__.osmPlaces = osmPlaces;
  __TEST__.osmKind = osmKind;
  __TEST__.kindFromTags = kindFromTags;
  __TEST__.overpassQuery = overpassQuery;
  __TEST__.nominatimSearchPlaces = nominatimSearchPlaces;
  __TEST__.nominatimViewbox = nominatimViewbox;
  __TEST__.kakaoPlaces = kakaoPlaces;
  __TEST__.kakaoArea = kakaoArea;
  __TEST__.nominatimArea = nominatimArea;
  __TEST__.nominatimAddress = nominatimAddress;
  __TEST__.nearbyState = function () { return _nearby; };
  __TEST__.scheduleNearbyLookup = scheduleNearbyLookup;
  __TEST__.nearbyReinferOnMove = nearbyReinferOnMove;
  __TEST__.nearbyResetOnNoPhotos = nearbyResetOnNoPhotos;
  __TEST__.nearbyOpenToggle = nearbyOpenToggle;
  __TEST__.nearbyAreaTag = nearbyAreaTag;
  __TEST__.nearbyAreaCached = nearbyAreaCached;
  __TEST__.ensureNearbyArea = ensureNearbyArea;
  __TEST__.nearbyAreas = function () { return _areaCache; };
  __TEST__.fetchWithTimeout = function (url, opt, ms) { return fetchWithTimeout(url, opt, ms); };
  __TEST__.nearbyReset = function () {
    nearbyResetState();
  };
}
