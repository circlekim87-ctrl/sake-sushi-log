<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사케 노트">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="사케 노트 — 마신 술과 다녀온 업장을 사진으로 남기는 기록 앱.">
<meta name="robots" content="noindex,nofollow">
<title>사케 노트 · 스시·사케 기록</title>
<style>
:root{
  --bg:#F4F2EC; --bg2:#EAE7DE; --card:#FFFFFF; --ink:#1A1D22; --ink2:#4B5057;
  --muted:#8E9298; --line:#E7E3DA; --line2:#F0EDE6;
  --navy:#1B2430; --navy2:#2C3846; --gold:#A5854F; --gold-soft:#F5EFE2; --gold-line:#E9DCC3;
  --danger:#B0473E; --r:18px;
  --shadow:0 1px 2px rgba(26,29,34,.04), 0 10px 26px -18px rgba(26,29,34,.35);
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  --serif:"AppleMyungjo","Nanum Myeongjo","Iowan Old Style",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden;font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(130% 55% at 50% -5%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font-size:16px}
img{display:block}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 11px) 16px 10px;background:rgba(244,242,236,.82);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .25s}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .mark{width:31px;height:31px;flex:0 0 31px;border-radius:9px;background:var(--navy);color:#F7F2E6;
  display:grid;place-items:center;font-family:var(--serif);font-size:18px;line-height:1;padding-bottom:1px}
.brand h1{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.02em;line-height:1.2}
.brand small{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--muted);font-weight:650;text-transform:uppercase;margin-top:1px}
.iconbtn{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid var(--line);background:rgba(255,255,255,.66);transition:.15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}

main{padding:4px 16px calc(100px + var(--safe-b));outline:0}
body[data-tab="grid"] main{padding-bottom:calc(168px + var(--safe-b))}
body[data-tab="grid"] .actionbar{display:block}
.view{animation:fade .24s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- headings ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:12px 2px 13px}
.vh h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.035em}
.vh p{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:-.01em}
.vh .side{font-size:11.5px;color:var(--muted);padding-bottom:3px;white-space:nowrap}
.mlabel{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;font-size:11px;letter-spacing:.13em;
  color:var(--muted);font-weight:700;text-transform:uppercase}
.mlabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 0;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{text-align:center;position:relative}
.stats div+div::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--line2)}
.stats b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stats span{font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 2px 11px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink2);
  font-size:12.5px;padding:7px 12px;border-radius:999px;font-weight:560;transition:.16s;letter-spacing:-.01em}
.chip.on{background:var(--navy);border-color:var(--navy);color:#F8F5EC}
.chip.mini{font-size:11.5px;padding:6px 10px}

/* ---------- visit card ---------- */
.vcard{display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;box-shadow:var(--shadow);margin-bottom:11px;transition:transform .13s}
.vcard:active{transform:scale(.993)}
.vrow{display:flex;align-items:flex-start;gap:10px}
.dbadge{width:46px;flex:0 0 46px;text-align:center;border-right:1px solid var(--line2);padding-right:7px}
.dbadge b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.04em}
.dbadge span{font-size:10px;color:var(--muted);letter-spacing:.08em}
.vmeta{flex:1;min-width:0;padding-top:1px}
.vname{font-size:15.5px;font-weight:660;letter-spacing:-.025em;display:flex;gap:6px;align-items:center}
.vsub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dot{width:2.5px;height:2.5px;border-radius:50%;background:#C9C4B8;display:inline-block}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.strip .th{position:relative;aspect-ratio:1;max-height:132px;border-radius:9px;overflow:hidden;background:var(--bg2)}
.strip img{width:100%;height:100%;object-fit:cover}
.strip .more{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(18,20,24,.5);color:#fff;display:grid;place-items:center;
  font-size:12.5px;font-weight:650;letter-spacing:-.02em}
.sakeline{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.stag{font-size:11px;color:#6E5A36;background:var(--gold-soft);border:1px solid var(--gold-line);
  padding:3px 8px;border-radius:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.snote{margin-top:8px;font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:2px 5px;border-radius:5px;
  background:#EEF0F2;color:#5C646E;vertical-align:1px;white-space:nowrap}
.badge.gold{background:var(--gold-soft);color:#7A6238}

/* ---------- sake card ---------- */
.ncard{display:flex;gap:11px;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:11px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform .13s}
.ncard:active{transform:scale(.993)}
.nthumb{width:56px;height:56px;flex:0 0 56px;border-radius:11px;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(150deg,#EFECE3,#DFD9CB);font-family:var(--serif);font-size:22px;color:#9C8F76}
.nthumb img{width:100%;height:100%;object-fit:cover}
.nbody{flex:1;min-width:0}
.nname{font-size:14.5px;font-weight:660;letter-spacing:-.025em;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nsub{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{position:relative;display:inline-block;color:#DDD7C9;font-size:11px;letter-spacing:1.4px;line-height:1;height:12px;margin-top:3px}
.stars i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);font-style:normal}
.nmemo{font-size:12px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.linkchip{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10.5px;color:#5A6470;
  background:#F1F3F5;border-radius:6px;padding:3px 7px;letter-spacing:-.01em}
.linkchip svg{width:11px;height:11px}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:15px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#B3B6BA}

/* ---------- cards / forms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 11px;font-size:13px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .side{margin-left:auto;font-size:11px;color:var(--muted);font-weight:550}
.stepnum{width:19px;height:19px;flex:0 0 19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;
  display:grid;place-items:center;font-weight:700;padding-bottom:1px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border:1.5px dashed #D9D3C5;
  border-radius:14px;color:var(--muted);font-size:12.5px;background:#FBFAF5;text-align:center;width:100%}
.drop svg{width:26px;height:26px;color:#B4AC9A;margin-bottom:2px}
.drop b{color:var(--ink);font-size:14px;font-weight:640;letter-spacing:-.02em}
.drop input{display:none}
.phlist{margin-top:4px}
.phrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.phrow:last-child{border-bottom:0}
.pth{width:50px;height:50px;flex:0 0 50px;border-radius:9px;object-fit:cover;background:var(--bg2)}
.phinfo{flex:1;min-width:0;font-size:11.5px;color:var(--muted)}
.phinfo b{display:block;font-size:13px;color:var(--ink);font-weight:600;letter-spacing:-.02em;margin-bottom:1px}
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);border:1px solid var(--line);
  border-radius:999px;padding:5px 9px;background:#fff;white-space:nowrap;font-weight:560}
.toggle.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;font-weight:600}
.input{width:100%;min-height:44px;border:1px solid var(--line);background:#FCFBF7;border-radius:10px;padding:10px 12px;
  outline:0;transition:.16s}
.input:focus{border-color:#C3BCA9;background:#fff;box-shadow:0 0 0 3px rgba(165,133,79,.1)}
textarea.input{resize:vertical;min-height:70px;line-height:1.45}
select.input{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E9298' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:15px;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:11px 14px;
  font-size:13.5px;font-weight:620;border:1px solid var(--line);background:#fff;color:var(--ink);
  letter-spacing:-.01em;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);color:#F9F6EE;border-color:var(--navy)}
.btn.ghost{background:#FBFAF5}
.btn.danger{color:var(--danger);border-color:#EBD9D6;background:#FDF7F6}
.btn.block{width:100%}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4}
.btn svg{width:15px;height:15px}
.hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.hint b{color:var(--ink2);font-weight:600}

/* ---------- grid tab ---------- */
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pool .cell{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--bg2);width:100%}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .pick{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.92);background:rgba(18,20,24,.26);display:grid;place-items:center;
  color:#fff;font-size:10.5px;font-weight:700;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.cell.sel .pick{background:var(--gold);border-color:#fff}
.cell.sel::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border:2px solid var(--gold);border-radius:9px;pointer-events:none}
.cell .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:9px;color:#fff;
  background:linear-gradient(to top,rgba(12,14,18,.75),rgba(12,14,18,0));white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.actionbar{position:fixed;left:0;right:0;bottom:calc(62px + var(--safe-b));padding:9px 16px 10px;z-index:25;
  background:linear-gradient(to top,rgba(244,242,236,.99),rgba(244,242,236,.82) 65%,rgba(244,242,236,0));
  pointer-events:none}
.actionbar .inner{max-width:460px;margin:0 auto;pointer-events:auto}
.previewBox{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.previewBox img{width:100%;height:auto}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(250,248,243,.93);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 7px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:#9A9EA4;
  font-size:10px;font-weight:650;letter-spacing:.01em;transition:color .16s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab .recicon{width:33px;height:33px;border-radius:50%;background:var(--navy);color:#F8F5ED;display:grid;
  place-items:center;margin-top:-8px;box-shadow:0 7px 16px -7px rgba(27,36,48,.75);transition:.16s}
.tab .recicon svg{width:19px;height:19px}
.tab.rec.on .recicon{background:var(--gold)}
.tab.rec span.lbl{margin-top:1px}

/* ---------- sheets ---------- */
.sheetwrap{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(16,18,22,.44);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:460px;max-height:92vh;max-height:92dvh;background:var(--bg);
  border-radius:22px 22px 0 0;box-shadow:0 -24px 44px -24px rgba(0,0,0,.45);display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.handle{width:38px;height:4px;border-radius:99px;background:#D7D1C4;margin:9px auto 3px;flex:0 0 auto}
.sheethead{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheethead h3{margin:0;font-size:15px;font-weight:700;flex:1;letter-spacing:-.025em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{overflow:auto;padding:14px 16px calc(26px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheetbody.tight{padding:0 0 calc(26px + var(--safe-b))}

/* ---------- detail ---------- */
.hero{position:relative;aspect-ratio:5/4;background:var(--bg2);overflow:hidden;margin:0}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:absolute;left:0;right:0;bottom:0;inset:auto 0 0 0;padding:52px 16px 14px;color:#fff;
  background:linear-gradient(to top,rgba(10,12,16,.86),rgba(10,12,16,0))}
.hero .cap b{font-size:19px;font-weight:680;letter-spacing:-.03em;display:block}
.hero .cap span{display:block;font-size:11.5px;opacity:.85;margin-top:3px}
.dt{margin-top:14px}
.dt h4{margin:16px 2px 8px;font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700;text-transform:uppercase}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photoGrid .ph{aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--bg2)}
.photoGrid .ph img{width:100%;height:100%;object-fit:cover}
.srow{display:flex;gap:9px;align-items:center;padding:9px 11px;background:#fff;border:1px solid var(--line);
  border-radius:11px;margin-bottom:6px;width:100%}
.srow .sn{flex:1;min-width:0}
.srow .sn b{display:block;font-size:13.5px;font-weight:620;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn span{font-size:11px;color:var(--muted)}
.srow .st{color:var(--gold);font-size:11px;letter-spacing:1.2px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.kv>div{background:#fff;padding:9px 11px}
.kv dt{font-size:10.5px;color:var(--muted);margin:0 0 2px;letter-spacing:.02em}
.kv dd{margin:0;font-size:13.5px;font-weight:560;letter-spacing:-.02em}
.noteBox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;
  color:var(--ink2);white-space:pre-wrap;line-height:1.55}
.rateRow{display:flex;gap:4px;align-items:center}
.rateRow button{font-size:26px;line-height:1;color:#DED8CA;transition:.12s}
.rateRow button.on{color:var(--gold)}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:90;background:#0C0E11;display:flex;flex-direction:column;
  animation:fade .16s ease both}
.lightbox .lbTop{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 10px) 14px 8px;color:#D8D4CA;font-size:12px}
.lightbox .lbStage{flex:1;display:grid;place-items:center;padding:0 6px;min-height:0}
.lightbox .lbStage img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox .lbBottom{display:flex;justify-content:space-between;gap:10px;padding:10px 16px calc(18px + var(--safe-b))}
.lightbox .lbBottom button{color:#EDE9DF;font-size:22px;padding:4px 14px}

h4{margin:16px 2px 8px;font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700;text-transform:uppercase}
h4.dt{margin-top:16px}

/* ---------- misc ---------- */
.empty{text-align:center;padding:38px 18px;color:var(--muted);font-size:12.5px;line-height:1.6}
.empty .big{font-family:var(--serif);font-size:28px;color:#CFC7B6;margin-bottom:9px;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,14px);
  background:rgba(24,27,32,.95);color:#F6F3EC;font-size:12.5px;padding:10px 15px;border-radius:11px;z-index:100;
  opacity:0;transition:.24s;pointer-events:none;max-width:86vw;text-align:center;line-height:1.45;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sep{height:1px;background:var(--line);margin:12px -14px}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.pill{font-size:10.5px;font-weight:650;color:#6E5A36;background:var(--gold-soft);border:1px solid var(--gold-line);
  padding:2px 7px;border-radius:6px}
.pill.dark{background:#EDEFF1;border-color:#E2E5E8;color:#5C646E}
.loader{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* --- iOS Safari 날짜·시간 입력칸이 카드 밖으로 넘치지 않게 --- */
.grid2 > *{min-width:0}
.grid2 .field{min-width:0}
input[type="date"],input[type="time"]{
  min-width:0;width:100%;max-width:100%;box-sizing:border-box;display:block;text-align:left;
}
input[type="date"]::-webkit-datetime-edit,
input[type="time"]::-webkit-datetime-edit{min-width:0;max-width:100%;overflow:hidden}
input[type="date"]::-webkit-date-and-time-value,
input[type="time"]::-webkit-date-and-time-value{min-width:0;text-align:left}
@media (max-width:360px){
  input[type="date"],input[type="time"]{font-size:14px;padding-left:10px;padding-right:8px}
}

/* --- 격자 화면이 비었을 때도 하단 합성 버튼이 안내 문구를 덮지 않게 --- */
body[data-tab="grid"] .view{min-height:calc(100vh - 132px)}
@supports (height:100dvh){body[data-tab="grid"] .view{min-height:calc(100dvh - 132px)}}

/* --- 앱 아이콘(헤더 배지) --- */
.brand .mark{overflow:hidden;padding:0;
  box-shadow:0 0 0 1px rgba(27,36,48,.10), 0 1px 3px rgba(27,36,48,.14)}
.brand .mark img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}

/* --- 카카오 로컬 키: 저장 뒤 접힌 상태 --- */
.kakaoState{display:flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--gold-line);
  border-radius:11px;background:var(--gold-soft)}
.kakaoState .dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#5F8A57}
.kakaoState .lbl{flex:1;font-size:13px;font-weight:650;color:var(--navy);letter-spacing:-.01em}
.kakaoState .btn{background:rgba(255,255,255,.85)}

/* --- 언어 선택(ko · en · ja) --- */
.iconbtn.langbtn{width:auto;min-width:38px;padding:0 9px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.seg{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6)}
.segbtn{flex:1;border:0;background:none;font-family:inherit;font-size:13px;font-weight:650;letter-spacing:-.01em;
  color:var(--ink2);padding:8px 6px;border-radius:9px;text-align:center;transition:.15s}
.segbtn.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(27,36,48,.13)}
.segbtn:active{transform:scale(.97)}

/* --- 라벨 사진으로 AI 자동 입력 (+기록·방문 상세 공통) --- */
.aiLabelCard{margin:2px 0 12px;padding:11px 12px;border:1px solid var(--gold-line);
  border-radius:14px;background:var(--gold-soft)}
.aiLabelCard .aiPick{width:100%;justify-content:center;gap:7px}
.aiLabelCard .hint{margin:7px 2px 0}
.edPhotoGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:2px}
.edph{padding:0;border:0;background:none;border-radius:9px;overflow:hidden;aspect-ratio:1;
  cursor:pointer;display:block}
.edph img{width:100%;height:100%;object-fit:cover;display:block}
.edph.on{box-shadow:0 0 0 2px var(--gold) inset}
@media (max-width:360px){.edPhotoGrid{grid-template-columns:repeat(5,1fr)}}

/* --- 0.5.0: N번째 방문 · 브랜드별 사케 히스토리 --- */
.vname{flex-wrap:wrap;row-gap:4px}
.badge.vord{background:var(--navy);color:#F8F5EC}
.badge.vord.lg{font-size:10px;padding:3px 7px}
.vordrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.vtot{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:2px 0;margin:0 0 12px;box-shadow:var(--shadow);overflow:hidden}
.vtrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;width:100%;padding:9px 13px;text-align:left}
.vtrow + .vtrow{border-top:1px solid var(--line2)}
.vtrow.on{background:var(--gold-soft)}
.vtrow .vtname{font-size:13.5px;font-weight:660;letter-spacing:-.02em}
.vtrow .vtmeta{font-size:10.5px;color:var(--muted);background:#F5F3EC;border-radius:6px;padding:2px 6px;
  white-space:nowrap}
.vtrow .vtchev{margin-left:auto;color:#C8C3B6;display:flex;flex:0 0 15px}
.nseg{margin:0 0 11px}
.bsec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1px 0 6px;
  margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.bhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;padding:11px 12px;text-align:left}
.bhead .bname{font-size:15px;font-weight:700;letter-spacing:-.025em}
.bhead .bmeta{font-size:10.5px;color:var(--muted);background:#F5F3EC;border-radius:6px;padding:2px 6px;
  white-space:nowrap}
.bhead .bchev{margin-left:auto;color:#C8C3B6;display:flex;transform:rotate(90deg);transition:transform .16s}
.bsec.closed .bhead .bchev{transform:none}
.brows{padding:0 8px}
.brow{background:#FBFAF5;border-color:var(--line2);margin-bottom:7px;padding:9px}
.brow:last-child{margin-bottom:0}
.brow .nthumb{width:46px;height:46px;flex:0 0 46px}
.brow .bwhen{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;
  font-size:10.5px;color:#5A6470}
.brow .bwhen .bvenue{display:inline-flex;align-items:center;gap:3px;min-width:0}
.brow .bwhen .bvenue svg{width:10px;height:10px;flex:0 0 10px}
.brow .bwhen .bdate{font-variant-numeric:tabular-nums}
.brow .bmemo{font-size:11.5px;color:var(--ink2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden}
.sakelinks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.sakelinks .linkchip{margin-top:0}

/* --- 0.6.0: 주종 분류(사케 · 와인 · 전통주 · 위스키) --- */
.catcards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.csum{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 9px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);text-align:left;box-shadow:var(--shadow);transition:.15s;min-width:0}
.csum .csumName{font-size:11.5px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.csum .csumN{font-size:10.5px;color:var(--muted);white-space:nowrap}
.csum.on{border-color:var(--navy);background:var(--navy)}
.csum.on .csumName{color:#F8F5EC}
.csum.on .csumN{color:rgba(248,245,236,.72)}
.csum.off{opacity:.55}
.csum:active{transform:scale(.98)}
@media (max-width:360px){.csum{padding:7px 6px}.csum .csumName{font-size:10.5px}}
.catsec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;
  box-shadow:var(--shadow);overflow:hidden}
.cathead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;padding:12px 13px;text-align:left;
  background:linear-gradient(180deg,rgba(165,133,79,.12),rgba(165,133,79,0))}
.cathead .catname{font-size:16.5px;font-weight:750;letter-spacing:-.03em}
.cathead .catmeta{font-size:10.5px;color:var(--muted);background:#F5F3EC;border-radius:6px;padding:2px 6px;
  white-space:nowrap}
.cathead .catchev{margin-left:auto;color:#C8C3B6;display:flex;transform:rotate(90deg);transition:transform .16s}
.catsec.closed .cathead .catchev{transform:none}
.catbody{padding:8px 8px 2px}
.catbody .bsec{box-shadow:none;border-color:var(--line2);margin-bottom:8px}
.catpick{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.65);margin-bottom:10px}
.catbtn{flex:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:650;color:var(--ink2);
  padding:7px 3px;border-radius:8px;letter-spacing:-.03em;min-width:0}
.catbtn.on{background:var(--navy);color:#F8F5EC;box-shadow:0 1px 2px rgba(27,36,48,.18)}
.catbtn:active{transform:scale(.97)}
.badge.catb{background:#EFEBE0;color:#4C5560}
.badge.catb-wine{background:#F7E9EA;color:#8E3B47}
.badge.catb-traditional{background:#EAF0E6;color:#4F6B45}
.badge.catb-whisky{background:#F8EEDD;color:#8A5A22}
.catline{margin-bottom:5px}

/* --- 0.6.0: 업장 상세 — 날짜별 방문 타임라인 --- */
.vtlhead{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--muted);margin:16px 2px 8px}
.vtl{position:relative;padding-left:14px}
.vtl:before{content:"";position:absolute;left:4px;top:6px;bottom:10px;width:1px;background:var(--line)}
.vday{position:relative;margin-bottom:12px}
.vday:before{content:"";position:absolute;left:-13px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 3px #F7F4EC}
.vdayhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;text-align:left;padding:2px 0 6px}
.vdayhead .vdaydate{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.vdayhead .vdaytime{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vdayhead .vdaychev{margin-left:auto;color:#C8C3B6;display:flex}
.vdaybody{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px;
  box-shadow:var(--shadow)}
.vsec + .vsec{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2)}
.vseclabel{font-size:10.5px;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.vempty{font-size:11.5px;color:var(--muted)}
.vnote{font-size:12px;line-height:1.5;color:var(--ink2);margin-top:8px;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vstrip{grid-template-columns:repeat(4,1fr);margin-top:0}
.vdlist{display:flex;flex-direction:column;gap:6px}
.vdlist .srow{padding:8px 10px}
.vdlist .srow .sn b{white-space:normal;display:block}
.sdline{display:block;margin-bottom:2px;line-height:1}

/* --- 0.7.0: 클라우드 저장 · 계정 --- */
.iconbtn.cloudbtn{position:relative}
.iconbtn.cloudbtn.on{color:#4F6B45;border-color:rgba(95,138,87,.36);background:rgba(95,138,87,.10)}
.iconbtn.cloudbtn.on:after{content:"";position:absolute;right:3px;top:3px;width:7px;height:7px;
  border-radius:50%;background:#5F8A57;box-shadow:0 0 0 1.5px #F4F2EC}
.iconbtn.cloudbtn.busy.on:after{background:var(--gold)}
.cloudState{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 11px;
  border:1px solid var(--gold-line);border-radius:11px;background:var(--gold-soft)}
.cloudState .dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#C8C3B6}
.cloudState .dot.on{background:#5F8A57}
.cloudState .lbl{flex:1;min-width:0;font-size:13px;font-weight:650;color:var(--navy);
  letter-spacing:-.01em;word-break:break-all}
.cloudpill{font-size:10.5px;font-weight:650;color:#4C5560;background:rgba(255,255,255,.85);
  border-radius:6px;padding:3px 7px;white-space:nowrap}
.cloudmsg{margin:2px 2px 10px;padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.45;
  letter-spacing:-.01em}
.cloudmsg.err{background:#FBEDEC;color:#8E3B47;border:1px solid #F0D3D1}
.cloudmsg.ok{background:#EAF0E6;color:#45603C;border:1px solid #D6E3CE}
.cloudsent{margin:0 2px 8px;font-size:13.5px;font-weight:650;color:var(--navy);word-break:break-all}
@media (max-width:360px){
  .iconbtn.cloudbtn{width:32px;flex:0 0 32px}
}
</style>

   사케 노트 — 스시 · 사케 기록 (프로토타입)
   단일 파일 모바일 웹앱. 데이터는 브라우저 localStorage에만 저장됩니다.

/* ------------------------------ utils ------------------------------ */
var DB_KEY = 'sakeSushiLog.demo.v1';
var APP_VERSION = '1.0.0';

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
var _seq = 0;
function uid(p) {
  _seq += 1;
  return (p || 'id') + Date.now().toString(36).slice(-5) + _seq.toString(36) +
    Math.random().toString(36).slice(2, 6);
}
function toYmd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayYmd() { return toYmd(new Date()); }
function fromYmd(s) {
  var p = String(s || '').split('-');
  if (p.length < 3) return new Date();
  return new Date(+p[0], (+p[1]) - 1, +p[2], 12, 0, 0);
}
var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
function fmtDot(s) { return s ? String(s).replace(/-/g, '.') : ''; }
function fmtKo(s) {
  if (!s) return '';
  var d = fromYmd(s);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
}
function fmtMonth(s) {
  var d = fromYmd(s);
  return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월';
}
function dayNum(s) { return String(parseInt(String(s).slice(8, 10), 10)); }
function weekdayOf(s) { return WEEK[fromYmd(s).getDay()]; }
function hm(iso) {
  if (!iso) return '';
  var m = String(iso).match(/T(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : '';
}
function num(v) { return (v === null || v === undefined || v === '') ? null : Number(v); }
function round1(n) { return Math.round(n * 10) / 10; }
function haversine(a, b) {
  if (!a || !b) return null;
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  var la1 = a.lat * rad, la2 = b.lat * rad;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(h))));
}
function distLabel(m) {
  if (m == null) return '';
  return m < 1000 ? m + 'm' : round1(m / 1000) + 'km';
}
function starsHtml(rating) {
  var r = Number(rating) || 0;
  if (r <= 0) return '<span class="stars">★★★★★<i style="width:0%">★★★★★</i></span>';
  var w = Math.max(0, Math.min(100, (r / 5) * 100));
  return '<span class="stars">★★★★★<i style="width:' + w + '%">★★★★★</i></span>';

  var count = v.getUint32(entry + 4, little);
  var base = tiff + v.getUint32(entry + 8, little);

    var den = v.getUint32(o + 4, little);
    return den ? v.getUint32(o, little) / den : 0;

  if (count >= 3) return rat(base) + rat(base + 8) / 60 + rat(base + 16) / 3600;

/* ------------------------------ image helpers ------------------------------ */
function loadImage(src) {
  return new Promise(function (resolve, reject) {
    var im = new Image();
    im.onload = function () { resolve(im); };
    im.onerror = function () { reject(new Error('이미지를 열 수 없어요')); };
    im.src = src;
  });
}
function readAsDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(fr.result); };
    fr.onerror = function () { reject(fr.error || new Error('파일을 읽지 못했어요')); };
    fr.readAsDataURL(file);
  });
}
function readAsArrayBuffer(file) {
  return new Promise(function (resolve) {
    var fr = new FileReader();
    fr.onload = function () { resolve(fr.result); };
    fr.onerror = function () { resolve(null); };
    fr.readAsArrayBuffer(file);
  });
}
async function shrink(dataUrl, maxSide, quality) {
  var im = await loadImage(dataUrl);
  var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
  var k = Math.min(1, maxSide / Math.max(w, h));
  if (k >= 1 && dataUrl.length < 340000) return dataUrl;
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k));
  c.height = Math.max(1, Math.round(h * k));
  var ctx = c.getContext('2d');
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality || 0.72);
}

function median(arr) {
  var a = arr.slice().sort(function (x, y) { return x - y; });
  if (!a.length) return 0;
  var m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function syncRecordForm() {
  var rec = ui.rec;

  if ((el = $('#rec-venue'))) rec.venueName = el.value;

  if ((el = $('[data-input="rec-note"]'))) rec.note = el.value;
  if ((el = $('[data-input="rec-date"]'))) rec.date = el.value;
  if ((el = $('[data-input="rec-time"]'))) rec.time = el.value;

function syncDrafts() {
  var rec = ui.rec;
  if (!rec) return;
  $$('#main [data-draft]').forEach(function (box) {
    var i = parseInt(box.getAttribute('data-draft'), 10);
    var d = rec.sakes[i];

    $$('[data-f]', box).forEach(function (el) { d[el.getAttribute('data-f')] = el.value; });
  });
}
function refreshRecSuggestions() {
  var rec = ui.rec;
  if (!rec || !rec.photos.length) return;
  var counts = {}, best = '', bestN = 0;
  rec.photos.forEach(function (p) {
    if (!p.taken) return;
    var d = p.taken.slice(0, 10);
    counts[d] = (counts[d] || 0) + 1;
    if (counts[d] > bestN) { bestN = counts[d]; best = d; }
  });
  if (best) rec.date = best;
  var first = rec.photos.filter(function (p) { return p.taken; })[0];
  if (first && !rec.time) rec.time = hm(first.taken);
  var gps = rec.photos.filter(function (p) { return p.gps; }).map(function (p) { return p.gps; });
  if (gps.length) {
    rec.lat = Math.round(median(gps.map(function (g) { return g.lat; })) * 1e5) / 1e5;
    rec.lng = Math.round(median(gps.map(function (g) { return g.lng; })) * 1e5) / 1e5;
    if (typeof nearbyReinferOnMove === 'function') nearbyReinferOnMove(rec);
    if (!rec.venueName) {
      var near = nearestVenue(rec.lat, rec.lng, nearbyRadiusM());
      if (near) {
        rec.venueName = near.venue.name;
        rec.venueId = near.venue.id;
        rec.area = near.venue.area || '';
        rec.autoVenue = true;   // 자동으로 채운 값(사진을 더하면 다시 판단)
      } else {
        startNearbyLookup(rec);
      }
    }
  }
  if (!rec.attachVisitId) {
    var t = findAttachTarget(rec);
    if (t) rec.attachVisitId = t.id;
  }
}
async function addRecordFiles(files) {
  var list = files ? files.slice(0) : [];
  if (!list.length) return;
  var rec = ui.rec || (ui.rec = newRecord());
  // 데모: '샘플로 체험'한 기록에 내 사진을 고르면 샘플 사진·사케 초안은 먼저 비운다
  // (샘플 좌표가 남아 GPS 중앙값이 샘플 업장에 머무는 일을 막는다)
  if (rec.photos.length && rec.photos.every(function (p) {
        return String(p.src || '').indexOf('seed:') === 0; })) {
    rec.photos = [];
    rec.sakes = rec.sakes.filter(function (d) { return !d.photoId; });
  }
  var total = 0, i;
  for (i = 0; i < list.length; i++) {
    if (list[i] && (!list[i].type || list[i].type.indexOf('image/') === 0)) total++;
  }
  var ok = 0, noExif = 0, failed = 0;
  for (i = 0; i < list.length; i++) {
    var f = list[i];
    if (!f || (f.type && f.type.indexOf('image/') !== 0)) continue;
    if (total > 5) toast('사진 ' + (ok + failed + 1) + '/' + total + '장 불러오는 중…');
    try {
      var r = await photoFromFile(f);
      rec.photos.push(r.photo);
      if (!r.hasExif) noExif++;
      ok++;
    } catch (err) { failed++; }
  }
  if (ok) {
    refreshRecSuggestions();
    render();
    toast('사진 ' + ok + '장 추가' +
      (noExif ? ' · EXIF 없는 ' + noExif + '장은 파일 시각 사용' : '') +
      (failed ? ' · ' + failed + '장은 열지 못했어요' : ''));
  } else if (failed) {
    toast('사진을 열지 못했어요. 아이폰 HEIC라면 설정 › 카메라 › 포맷을 "높은 호환성"으로 바꿔 주세요.');
  }
}

async function callVision(mediaType, b64) {

      method: 'POST',

      })
    });
    if (!res.ok) throw new Error('API ' + res.status);
    json = await res.json();
    text = (json.choices && json.choices[0] && json.choices[0].message.content) || '';
  } else {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': s.apiKey.trim(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'

      body: JSON.stringify({
        model: (s.model || 'claude-3-5-haiku-latest').trim(),
        max_tokens: 400,
        messages: [{

            { type: 'text', text: prompt }

        }]

    if (!res.ok) throw new Error('API ' + res.status);
    json = await res.json();

function drawCell(ctx, img, x, y, size) {
  var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, size, size);
  ctx.clip();
  /* 1) 여백은 같은 사진을 흐리게 깔아 채운다 (무크롭) */
  var tmp = document.createElement('canvas');
  tmp.width = 32; tmp.height = 32;
  var tc = tmp.getContext('2d');
  var cover = Math.max(32 / iw, 32 / ih);
  tc.drawImage(img, (32 - iw * cover) / 2, (32 - ih * cover) / 2, iw * cover, ih * cover);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tmp, 0, 0, 32, 32, x, y, size, size);
  /* 2) 원본 비율 유지, 잘림 없이 중앙 배치 */
  var k = Math.min(size / iw, size / ih);
  var dw = iw * k, dh = ih * k;
  ctx.drawImage(img, x + (size - dw) / 2, y + (size - dh) / 2, dw, dh);
  ctx.restore();
}
async function composeGrid() {
  var g = ui.grid;
  var n = g.layout === 9 ? 3 : 2;
  if (g.sel.length !== g.layout) return;
  var size = g.size, gap = g.gap;
  var canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  var cell = (size - gap * (n + 1)) / n;
  var imgs = [];
  for (var i = 0; i < g.sel.length; i++) {
    imgs.push(await loadImage(photoSrc(g.sel[i])));
  }
  for (var j = 0; j < imgs.length; j++) {
    var col = j % n, row = Math.floor(j / n);
    var x = gap + col * (cell + gap);
    var y = gap + row * (cell + gap);
    drawCell(ctx, imgs[j], x, y, cell);
  }
  g.last = {
    jpg: canvas.toDataURL('image/jpeg', 0.92),

async function importJson(file) {
  if (!file) return;
  try {
    var text = await file.text();
    var obj = JSON.parse(text);
    var data = obj && obj.data ? obj.data : obj;
    if (!data || !data.venues || !data.visits || !data.sakes) throw new Error('형식이 맞지 않는 파일이에요');
    confirmSheet('기록 가져오기', '지금 기록을 이 파일로 바꿉니다. 기존 기록은 사라져요.', '가져오기', false, function () {
      state = normalizeState(data);
      if (obj && obj.photos && typeof obj.photos === 'object') {
        // 백업에 든 사진을 IndexedDB 로 옮겨 두면 새로고침해도 그대로 보인다
        Object.keys(obj.photos).forEach(function (pid) {
          var v = obj.photos[pid];
          if (typeof v === 'string' && v) photoStore(pid, v);
        });
      }
      photoMigrateInline();
      saveState();
      closeSheet();
      setTab('venues');
      toast('가져왔어요 · 방문 ' + state.visits.length + '건, 주류 ' + state.sakes.length + '병');
    });
  } catch (e) {
    toast('가져오기 실패: ' + (e.message || '파일을 읽지 못했어요'));
  }
}

async function addPhotosToVisit(files, visitId) {
  var v = visitById(visitId);
  var list = files ? files.slice(0) : [];
  if (!v || !list.length) return;
  var ok = 0, failed = 0;
  for (var i = 0; i < list.length; i++) {
    if (!list[i] || (list[i].type && list[i].type.indexOf('image/') !== 0)) continue;
    if (list.length > 5) toast('사진 ' + (ok + failed + 1) + '/' + list.length + '장 불러오는 중…');
    try {
      var r = await photoFromFile(list[i]);
      v.photos.push(r.photo);
      ok++;
    } catch (e) { failed++; }
  }
  if (ok) {
    saveState();
    openVisit(visitId);
    render();
    toast('사진 ' + ok + '장 추가' + (failed ? ' · ' + failed + '장 실패' : ''));
  } else if (failed) {
    toast('사진을 열지 못했어요. 아이폰 HEIC라면 설정 › 카메라 › 포맷을 "높은 호환성"으로 바꿔 주세요.');
  }
}

/* 고른 파일 목록을 먼저 배열로 복사한다. iOS 사파리는 input.value 를 비우면

function filesOf(input) {

}

/* =====================================================================
   위치 기반 업장 추론 — 사진 EXIF 좌표로 '처음 가는 업장' 후보 찾기
   ---------------------------------------------------------------------
   · 이미 방문한 업장은 기존 기능이 먼저 처리한다(설정한 조회 반경과 같은 기준).
   · 그 밖의 위치는 아래 순서로 주변 업장 후보를 조회한다.
       1) 설정에 카카오 로컬 REST 키가 있으면 카카오 로컬(음식점 FD6, 설정 반경)
       2) 키가 없거나 카카오가 실패하면 OpenStreetMap
          - Overpass API : 설정 반경의 음식점·바·이자카야 등 POI
          - Nominatim    : 역지오코딩(accept-language=선택 언어)으로 동네명
   · 기본 조회 반경은 5m (설정 › 위치 · 업장 추론에서 5 / 20 / 50 / 100m).
     실내 GPS 오차로 0건이면 한 번에 30m로 넓혀 찾는 버튼을 보여 준다.
   · 모든 조회는 비동기이며 실패·타임아웃·오프라인이어도 수동 입력을 막지 않는다.
   · 외부로 나가는 값은 사진의 좌표뿐이다(사진·기록·개인정보는 보내지 않음).
   · 로딩은 어떤 경우에도 끝난다:
       개별 요청 4초(AbortController + setTimeout) · 한 번의 조회 전체 6.5초 ·
       안전망 8초(watchdog). 응답이 끝내 오지 않아도 로딩 상태를 강제로 닫는다.
   · 결과가 없는 좌표를 '찾는 중'으로 계속 그리지 않는다. 자동 조회가 예정되지
     않은 상태면 바로 누를 수 있는 안내([주변 업장 찾기])를 보여 준다.

     버튼으로 추천 영역을 언제든 다시 연다.

var NEARBY_RADIUS_DEFAULT = 5;
var NEARBY_RADIUS_OPTIONS = [5, 20, 50, 100];

  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
var NOMINATIM_REVERSE = 'https://nominatim.openstreetmap.org/reverse';
var KAKAO_CATEGORY = 'https://dapi.kakao.com/v2/local/search/category.json';

var NEARBY_TOTAL_MS = 6500;        // 한 번의 조회 전체 상한(역지오코딩 포함)
var NEARBY_WATCHDOG_MS = 8000;     // 프라미스가 끝내 안 끝날 때 로딩을 강제로 닫는 안전망

   사진 한 장만 더 넣어도 방금 잡힌 업장이 풀린다. 다른 동네(수백 m~수 km)로
   옮겨 간 경우만 풀리도록 하한을 둔다. 설정 반경이 더 넓으면 그 값을 따른다. */
var NEARBY_CLEAR_MIN_M = 50;

var _nearbySeq = 0;        // 조회 세대 — 늦게 도착한 응답이 새 상태를 덮지 않게 한다
var _nearbyLastNom = 0;    // Nominatim 마지막 요청 시각(간격 유지)

var _nearby = {
  key: '', radius: 0, widened: false,
  loading: false, done: false, places: [], area: '', address: '', src: '', error: '', at: 0

function nearbyKey(lat, lng) {
  return Number(lat).toFixed(4) + ',' + Number(lng).toFixed(4);
}

}

  if (!rec || rec.lat == null || rec.lng == null) return null;
  return _nearby.key === nearbyKey(rec.lat, rec.lng) ? _nearby : null;
}

/* ------------------------------ fetch util ------------------------------ */
/* AbortController + setTimeout 타임아웃.
   AbortSignal.timeout() 같은 최신 API는 쓰지 않는다(iOS 구버전 Safari 호환).
   브라우저가 금지하는 헤더(User-Agent·Referer 등)는 넣지 않는다.
   응답 본문 파싱이 멈춰도 타이머가 프라미스를 반드시 정리한다. */
function fetchWithTimeout(url, opt, ms) {
  // 개별 요청은 인자와 상관없이 NEARBY_REQUEST_MS(4초)를 넘지 않는다
  var limit = Math.max(300, Math.min(Number(ms) > 0 ? Number(ms) : NEARBY_REQUEST_MS, NEARBY_REQUEST_MS));
  var src = opt || {};
  var req = { method: src.method || 'GET' };
  if (src.headers) req.headers = src.headers;
  if (src.body != null) req.body = src.body;
  return new Promise(function (resolve, reject) {
    var settled = false, ctrl = null, timer = null;
    function finish(fn, arg) {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      try { fn(arg); } catch (e) { /* noop */ }
    }
    if (typeof AbortController === 'function') {
      try { ctrl = new AbortController(); req.signal = ctrl.signal; } catch (e) { ctrl = null; }
    }
    timer = setTimeout(function () {
      finish(reject, new Error('timeout'));
      try { if (ctrl) ctrl.abort(); } catch (e) { /* noop */ }
    }, limit);
    var p;
    try {
      p = fetch(url, req);
    } catch (e) {
      finish(reject, e || new Error('network'));
      return;
    }
    if (!p || typeof p.then !== 'function') { finish(reject, new Error('fetch unsupported')); return; }
    p.then(function (res) {
      if (!res) throw new Error('network');
      if (res.status >= 400) throw new Error('http ' + res.status);
      return res.text();
    }).then(function (text) {
      var data = null;
      if (text) {
        try { data = JSON.parse(text); } catch (e) { throw new Error('bad json'); }
      }
      finish(resolve, data);
    }).catch(function (err) {
      finish(reject, err || new Error('network'));
    });
  });
}
/* 여러 조회 중 하나라도 결과가 나오면 기다리지 않고 바로 반환한다.
   모두 끝나면 합쳐서 반환(0건 포함). 막힌 미러가 느릴 때 대기 시간을 줄인다. */

    var n = promises.length, done = 0, out = [], settled = false;
    function finish() { if (settled) return; settled = true; resolve(out); }
    if (!n) { resolve(out); return; }
    promises.forEach(function (p) {
      p.then(function (list) {
        done++;
        if (list && list.length) { out = out.concat(list); finish(); return; }
        if (done === n) finish();
      }, function () {
        done++;
        if (done === n) finish();
      });
    });

}
/* 남은 예산 안에서만 기다린다 — 지역명 같은 부가 정보가 로딩을 붙잡지 않게 */

  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, Math.max(50, Number(ms) || 0));
    promise.then(function (v) {
      if (done) return;
      done = true; clearTimeout(timer); resolve(v);
    }, function () {
      if (done) return;
      done = true; clearTimeout(timer); resolve(null);
    });
  });
}
/* Nominatim 공공 API 는 초당 1회 이하를 요구한다. 역지오코딩과 검색이 겹치지 않게
   간격을 지키되, 기다리는 시간이 남은 예산을 넘지 않게 자른다. */

  var now = Date.now();
  var gap = (_nearbyLastNom > 0) ? (_nearbyLastNom + NEARBY_NOMINATIM_GAP_MS - now) : 0;
  if (gap < 0) gap = 0;
  var cap = Math.max(0, budget - 300);
  if (gap > cap) gap = cap;
  _nearbyLastNom = now + gap;
  return gap > 0 ? wait(gap) : Promise.resolve();

/* ------------------------------ 카카오 로컬 ------------------------------ */
function fetchKakao(lat, lng, key, radius, ms) {
  var r = Number(radius) || NEARBY_RADIUS_DEFAULT;
  var url = KAKAO_CATEGORY + '?category_group_code=FD6' +
    '&x=' + encodeURIComponent(lng) + '&y=' + encodeURIComponent(lat) +
    '&radius=' + Math.round(r) + '&sort=distance&size=15';
  return fetchWithTimeout(url, { headers: { Authorization: 'KakaoAK ' + String(key).trim() } },
    ms || NEARBY_REQUEST_MS)
    .then(function (json) { return kakaoPlaces(json, lat, lng, r); });
}
function kakaoPlaces(json, lat, lng, radius) {
  var r = Number(radius) || NEARBY_RADIUS_DEFAULT;
  var docs = (json && json.documents) || [];
  var out = [];
  docs.forEach(function (d) {
    var name = String(d.place_name || '').trim();
    if (!name) return;
    var plat = parseFloat(d.y), plng = parseFloat(d.x);
    if (isNaN(plat) || isNaN(plng)) return;
    var dist = haversine({ lat: lat, lng: lng }, { lat: plat, lng: plng });
    if (dist != null && dist > r) return;
    var road = String(d.road_address_name || '').trim();
    var addr = road || String(d.address_name || '').trim();
    out.push({
      name: name,
      kind: String(d.category_name || '').split('>').pop().trim(),
      address: addr,
      area: kakaoArea(d.address_name || road),
      lat: plat, lng: plng,
      dist: dist
    });
  });
  return out;
}
function kakaoArea(addr) {
  var parts = String(addr || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return '';
  var city = shortCity(parts[0]);
  var out = [city];
  for (var i = 1; i < parts.length && out.length < 3; i++) {
    if (/^\d/.test(parts[i])) break;
    out.push(parts[i]);
  }
  return out.join(' ').trim();
}

/* ------------------------------ OpenStreetMap ------------------------------ */
function overpassQuery(lat, lng, radius) {
  var r = Number(radius) || NEARBY_RADIUS_DEFAULT;
  var around = '(around:' + r + ',' + lat + ',' + lng + ')';
  return '[out:json][timeout:5];(' +
    'nwr["amenity"~"^(restaurant|bar|pub|izakaya|sushi|biergarten|food_court)$"]' + around + ';' +
    'nwr["cuisine"~"sushi|japanese|sake|washoku|izakaya",i]' + around + ';' +
    ');out center 40;';
}
async function fetchOsm(lat, lng, radius, budget) {

  var body = 'data=' + encodeURIComponent(overpassQuery(lat, lng, r));
  var left = (typeof budget === 'function')
    ? budget : function (ms) { return Number(ms) > 0 ? Number(ms) : NEARBY_REQUEST_MS; };
  var errs = [];
  var answered = false;   // 요청이 '답'을 했는가(비어 있음 포함) — 실패(네트워크)와 구분한다
  function keep(e) {
    errs.push(e);
    if (e && e.empty) answered = true;
    return [];
  }
  function search(phrase) {
    if (left() < 600) return Promise.resolve([]);
    return fetchNominatimPlaces(lat, lng, phrase, r, left()).then(function (l) {
      answered = true;
      return l;
    }).catch(keep);
  }

  // 1) 주 Overpass 엔드포인트 — 실패하면 곧장 다음 단계로 넘어간다(기다리지 않음)
  var list = await overpassTry(OVERPASS_ENDPOINTS[0], body, lat, lng, left(), r).catch(keep);
  if (list.length) return { list: list, answered: true };

  // 2) 보조 미러 + Nominatim 검색을 동시에 — 둘 중 하나라도 결과가 나오면 바로 넘어간다
  list = await nearbyFirst([
    left() < 500 ? Promise.resolve([])
      : overpassTry(OVERPASS_ENDPOINTS[1], body, lat, lng, left(), r).catch(keep),
    search('restaurant')

  if (list.length) return { list: list, answered: true };

  // 3) 그래도 없으면 술집까지 한 번 더 (남은 예산이 있을 때만)
  list = await search('bar');
  if (list.length) return { list: list, answered: true };
  // 반경 안에 아무것도 없다는 '답'을 받았으면 빈 결과, 모두 실패했으면 오류

function wait(ms) {

}
function overpassTry(endpoint, body, lat, lng, ms, radius) {

    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }, ms).then(function (json) {
    var list = osmPlaces(json, lat, lng, radius);
    if (!list.length) {
      var e = new Error('empty');

/* Overpass 미러가 막힌 네트워크용: 같은 OSM 데이터를 Nominatim 검색으로 받아 온다.
   q=[amenity=restaurant] 같은 특수 구문은 이름 매칭이 아니라 카테고리 검색이다. */

function fetchNominatimPlaces(lat, lng, phrase, radius, ms) {

  var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&extratags=1' +
    '&limit=15&bounded=1&accept-language=' + osmLang() +
    '&q=' + encodeURIComponent('[' + 'amenity=' + phrase + ']') +
    '&viewbox=' + nominatimViewbox(lat, lng, r);
  return nominatimGate(ms).then(function () {
    return fetchWithTimeout(url, { headers: { Accept: 'application/json' } },
      ms || NEARBY_REQUEST_MS);

function nominatimSearchPlaces(json, lat, lng, radius) {

  var out = [];
  rows.forEach(function (x) {
    var name = String(x && (x.name || (x.address && x.address.amenity)) || '').trim();
    if (!name) return;
    var plat = parseFloat(x.lat), plng = parseFloat(x.lon);
    if (isNaN(plat) || isNaN(plng)) return;
    var dist = haversine({ lat: lat, lng: lng }, { lat: plat, lng: plng });
    if (dist == null || dist > r) return;
    var a = x.address || {};
    var road = String(a.road || '').trim(), no = String(a.house_number || '').trim();
    out.push({
      name: name,
      kind: kindFromTags(x.type, x.extratags && x.extratags.cuisine),
      address: road ? road + (no ? ' ' + no : '') : '',
      area: '',
      lat: plat, lng: plng, dist: dist

}
function osmPlaces(json, lat, lng, radius) {
  var r = Number(radius) || NEARBY_RADIUS_DEFAULT;
  var els = (json && json.elements) || [];
  var out = [];
  els.forEach(function (el) {
    var t = el.tags || {};
    var name = String(t['name:ko'] || t.name || '').trim();
    if (!name) return;
    var plat = (typeof el.lat === 'number') ? el.lat : (el.center && el.center.lat);
    var plng = (typeof el.lon === 'number') ? el.lon : (el.center && el.center.lon);
    if (typeof plat !== 'number' || typeof plng !== 'number') return;
    var dist = haversine({ lat: lat, lng: lng }, { lat: plat, lng: plng });
    if (dist == null || dist > r) return;
    out.push({ name: name, kind: osmKind(t), address: '', area: '', lat: plat, lng: plng, dist: dist });
  });

}
function osmKind(t) {

}
/* OSM 태그 → 한국어 업종 라벨 */
function kindFromTags(amenity, cuisine) {
  var a = String(amenity || ''), c = String(cuisine || '').toLowerCase();
  if (c.indexOf('sushi') >= 0) return '스시';
  if (c.indexOf('japanese') >= 0) return '일식';
  if (a === 'izakaya' || c.indexOf('izakaya') >= 0) return '이자카야';
  if (a === 'bar' || a === 'pub' || a === 'biergarten') return '바';
  if (a === 'restaurant' || a === 'food_court') return '음식점';
  if (a === 'cafe') return '카페';

function fetchReverse(lat, lng, ms) {
  var url = NOMINATIM_REVERSE + '?format=jsonv2&addressdetails=1&zoom=16&accept-language=' + osmLang() +
    '&lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lng);
  return nominatimGate(ms).then(function () {
    return fetchWithTimeout(url, { headers: { Accept: 'application/json' } },
      ms || NEARBY_REQUEST_MS);

function shortCity(s) {

}
function nominatimArea(json) {
  var a = (json && json.address) || {};
  var city = shortCity(a.city || a.province || a.state || a.town || a.village || '');
  var district = a.borough || a.city_district || a.county || a.district || '';
  var dong = a.suburb || a.quarter || a.neighbourhood || a.hamlet || '';
  var parts = [];
  [city, district, dong].forEach(function (p) {
    p = String(p || '').trim();
    if (p && parts.indexOf(p) < 0) parts.push(p);
  });

}

  var a = (json && json.address) || {};
  var area = nominatimArea(json);
  var road = String(a.road || '').trim();
  var no = String(a.house_number || '').trim();
  if (road) return road + (no ? ' ' + no : '') + (area ? ', ' + area : '');
  var display = String((json && json.display_name) || '').trim();
  if (display) return display.split(',').slice(0, 3).join(',').trim();

/* ------------------------------ merge & lookup ------------------------------ */
function nearbyMerge(places) {
  var seen = {}, out = [];
  (places || []).forEach(function (p) {
    if (!p || !p.name) return;
    var k = String(p.name).replace(/\s+/g, '').toLowerCase();
    if (seen[k]) return;
    seen[k] = 1;
    out.push(p);
  });
  out.sort(function (a, b) {
    var da = (a.dist == null) ? 1e9 : a.dist, db = (b.dist == null) ? 1e9 : b.dist;
    return da - db;
  });

    (st.sakes || []).forEach(function (s) { add(s.photo); });

      id: id, src: src, taken: ex.date || fileTime(file),

      isLabel: false

/* =====================================================================
   N번째 방문 · 브랜드별 사케 히스토리 (0.5.0)
   ---------------------------------------------------------------------
   · 방문 순번: 같은 업장(이름이 같은 업장 기록은 하나로 묶는다)의 방문을
     날짜+시간 오름차순으로 세어 1번째 · 2번째 … 를 매긴다. 그릴 때마다
     다시 계산하므로 방문을 추가·수정·삭제하거나 날짜를 바꿔도 순번이
     저절로 맞는다.
   · 브랜드: 사케 이름 앞머리와 양조장(brewery)을 맞춰 브랜드/양조장 단위로
     묶는다. 띄어쓰기·대소문자·'슈조/주조' 같은 꼬리말 차이는 하나로 본다.
   원본 소스(sake-journal-src)는 건드리지 않고 build.py 가 이 파일을 덧붙인다.
   ===================================================================== */

/* ------------------------------ 방문 순번 ------------------------------ */
function _cleanName(s) {

  return ven && ven.name ? _cleanName(ven.name) : '';

  state.visits.forEach(function (v) {

/* 업장별 총 방문 횟수 (같은 이름 업장은 합산) */

      order.push(k);

  if (g && g.count > 1) h += '<span class="badge">총 ' + g.count + '회 방문</span>';
  h += '</div>';

/* ------------------------------ 브랜드 ------------------------------ */
/* 이름과 양조장을 비교할 때 무시하는 꼬리말 */
var BRAND_NOISE = ['슈조', '주조', '주조소', '주류', '양조', '양조장', '양조원', '본점', '본가',
  '제조', '유한회사', '주식회사', '콜라보', '외', '사', 'brewing', 'brewery', 'shuzo', 'jozo',

var BRAND_SPEC = ['준마이다이긴죠', '준마이긴죠', '특별준마이', '준마이', '다이긴죠', '긴죠',

  var name = _cleanName(s && s.name);

  /* 1) 이름과 양조장의 공통 앞부분 — '바라 마송 레 마르간' ↔ '바라 마송 · 샴페인' */

function _sakeWhen(s) {

/* 생산자 이름 앞에 붙는 말(도멘·샤또·증류소…)은 브랜드가 아니다 */
BRAND_NOISE = BRAND_NOISE.concat(['도멘', '도멜', '샤또', '샤토', '와이너리', '증류소', '양조장',
  '샹파뉴', '보르도', '부르고뉴', '스카치', '켄터키',
  'domaine', 'chateau', 'château', 'winery', 'distillery', 'estate',

/* 이름 앞에 와도 브랜드가 아닌 주종·스타일 낱말 */
BRAND_SPEC = BRAND_SPEC.concat(['레드', '화이트', '로제', '스파클링', '디저트', '주정강화',
  '탁주', '약주', '청주', '증류주', '과실주', '싱글몰트', '블렌디드', '몰트', '버번', '라이',
  '빈티지', '리저브', 'vintage', 'reserve']);

/* 생산자 이름의 앞·뒤 수식어(도멘·샤또·증류소·샹파뉴…)를 건너뛴 낱말 목록 */
function _stripNoise(words) {
  var a = 0, b = words.length;
  while (a < b && (_isNoiseWord(words[a]) || _isNumeric(words[a]))) a++;
  while (b > a && (_isNoiseWord(words[b - 1]) || _isNumeric(words[b - 1]))) b--;
  return words.slice(a, b);
}
/* 이름 낱말 안에 이 낱말들이 그대로 이어서 나오는가 */
function _wordsInside(list, hay) {
  if (!list.length || list.length > hay.length) return false;
  for (var i = 0; i + list.length <= hay.length; i++) {
    var ok = true;
    for (var j = 0; j < list.length; j++) {
      if (_brandToken(hay[i + j]) !== _brandToken(list[j])) { ok = false; break; }
    }
    if (ok) return true;
  }
  return false;
}

/* 주류 하나의 브랜드(양조장·생산자·증류소) 이름 */
function brandOfSake(s) {
  var name = _cleanName(s && s.name);
  if (!name) return '기타';
  var nw = _brandWords(name);
  var bw = _stripNoise(_brandWords(s && s.brewery));
  /* 와인·전통주·위스키는 이름이 큐베·제품명이라 생산자(도멘·양조장·증류소)를
     브랜드로 삼는다. 이름에 그대로 나오면 이름 쪽 표기를 따른다. */
  if (catIdOf(s) !== 'sake' && bw.length) {
    for (var t = bw.length; t >= 1; t--) {
      var tail = bw.slice(bw.length - t);
      if (_wordsInside(tail, nw)) return tail.join(' ');
    }
    return bw.join(' ');
  }
  /* 1) 이름과 생산자의 공통 앞부분 — '바라 마송 레 마르간' ↔ '바라 마송 · 샴페인' */
  var best = 0;
  for (var k = 1; k <= nw.length && k <= bw.length; k++) {
    if (_brandToken(nw[k - 1]) !== _brandToken(bw[k - 1])) break;
    best = k;
  }
  if (best) {
    var head = nw.slice(0, best).filter(function (w) {
      return !_isSpecWord(w) && !_isNoiseWord(w) && !_isNumeric(w);
    }).join(' ');
    if (head) return head;
  }
  /* 2) 이름 앞머리의 첫 브랜드 낱말 — 등급·스타일·숫자·빈티지는 건너뛴다 */
  for (var i = 0; i < nw.length && i < 4; i++) {
    var w = nw[i];
    if (_isNumeric(w) || _isSpecWord(w) || _isNoiseWord(w)) continue;
    return w;
  }
  /* 3) 생산자 이름 앞머리 */
  for (var b = 0; b < bw.length; b++) {
    if (_isNumeric(bw[b]) || _isNoiseWord(bw[b])) continue;
    return bw[b];
  }
  return name;
}

/* 브랜드 묶음: 주종 + 브랜드가 같아야 같은 묶음 */
function brandGroups(sakes) {
  var map = {}, order = [];
  (sakes || []).forEach(function (s) {
    var cid = catIdOf(s);
    var name = brandOfSake(s);
    var key = cid + ':' + (_brandToken(name) || 'etc');
    var g = map[key];
    if (!g) {
      g = map[key] = { key: key, name: name, cat: cid, sakes: [], count: 0, times: 0, last: '' };
      order.push(key);
    }
    g.sakes.push(s);
  });
  var out = order.map(function (k) {
    var g = map[k];
    var occ = {}, dates = [];
    g.sakes.forEach(function (s) {
      var v = s.visitId ? visitById(s.visitId) : null;
      occ[v ? ('v:' + v.id) : ('s:' + s.id)] = 1;
      if (v && v.date) dates.push(v.date);
    });
    dates.sort();
    g.count = g.sakes.length;
    g.times = Object.keys(occ).length;
    g.last = dates.length ? dates[dates.length - 1] : '';
    g.sakes.sort(function (a, b) {
      var ka = _sakeWhen(a), kb = _sakeWhen(b);
      if (ka !== kb) return ka < kb ? 1 : -1;
      return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
    });
    return g;
  });
  return out.sort(function (a, b) {
    var la = a.last || '', lb = b.last || '';
    if (la !== lb) return la < lb ? 1 : -1;
    if (a.count !== b.count) return b.count - a.count;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
}

function brandSectionHtml(g, shut, hideCat) {

  h += '<span class="bchev">' + ICON.chev + '</span>';

function catMetaBits(s) {
  var cid = catIdOf(s);
  if (cid === 'sake') return [s.grade, s.polish ? '정미보합 ' + s.polish + '%' : ''];

/* 브랜드 히스토리 한 줄: 이름 · 주종별 세부 · 마신 업장(몇 번째 방문) · 날짜 · 메모 */

/* ------------------------------ 목록 화면 ------------------------------ */
function catTotals() {
  var map = {};
  CAT_LIST.forEach(function (c) { map[c.id] = { id: c.id, ko: c.ko, count: 0, occ: {}, last: '' }; });
  state.sakes.forEach(function (s) {

    if (v) {
      g.occ[v.id] = 1;
      if ((v.date || '') > g.last) g.last = v.date;
    }

  return CAT_LIST.map(function (c) {
    var g = map[c.id];
    g.times = Object.keys(g.occ).length;

  });

/* 등급·종류 칩 순서: 주종 순서 → 그 주종의 종류 순서 */
function _styleRank(g) {

/* 등급·종류 칩 — 지금 고른 주종(과 검색어) 안에서 실제로 있는 값만 */
function gradeChips() {
  var base = state.sakes.filter(function (s) { return ui.noteCat === 'all' || catIdOf(s) === ui.noteCat; });
  var present = {}, order = [];
  base.forEach(function (s) {
    var g = s.grade || '기타';
    if (!present[g]) order.push(g);
    present[g] = (present[g] || 0) + 1;
  });
  order.sort(function (a, b) {
    var ra = _styleRank(a), rb = _styleRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, 'ko');
  });
  var out = '<button class="chip' + (ui.gradeFilter === 'all' ? ' on' : '') + '" data-act="grade-filter" data-v="all">전체 ' + base.length + '</button>';
  order.forEach(function (g) {
    out += '<button class="chip' + (ui.gradeFilter === g ? ' on' : '') + '" data-act="grade-filter" data-v="' + esc(g) + '">' +
      esc(g) + ' <span style="opacity:.5">' + present[g] + '</span></button>';
  });
  return out;
}

function filteredSakes() {
  var q = (ui.noteQuery || '').trim().toLowerCase();
  var arr = state.sakes.slice();
  if (ui.noteCat && ui.noteCat !== 'all') {
    arr = arr.filter(function (s) { return catIdOf(s) === ui.noteCat; });
  }
  if (ui.gradeFilter !== 'all') {
    arr = arr.filter(function (s) { return (s.grade || '기타') === ui.gradeFilter; });
  }
  if (q) {
    arr = arr.filter(function (s) {
      var visit = s.visitId ? visitById(s.visitId) : null;
      var venue = visit ? venueById(visit.venueId) : null;
      var hay = [s.name, s.brewery, s.rice, s.memo, s.grade, s.vintage, s.age, s.cask,
        catName(s), venue ? venue.name : ''].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  if (ui.noteSort === 'rating') arr.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
  else if (ui.noteSort === 'name') arr.sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || ''), 'ko'); });
  else arr.sort(function (a, b) {
    var va = a.visitId ? visitById(a.visitId) : null, vb = b.visitId ? visitById(b.visitId) : null;
    return ((vb ? vb.date : '') + (vb ? vb.time : '')).localeCompare((va ? va.date : '') + (va ? va.time : ''));
  });
  return arr;
}

      category: catIdOf(sake), name: sake.name || '', brewery: sake.brewery || '', grade: sake.grade || '',

      vintage: sake.vintage == null ? '' : sake.vintage, age: sake.age == null ? '' : sake.age,
      cask: sake.cask || '', abv: sake.abv == null ? '' : sake.abv,

    };
  } else {
    d = newDraft(null);
    if (opts.category && CAT_BY_ID[opts.category]) d.category = opts.category;
  }
  _ed = { id: sake ? sake.id : null, draft: d, visitId: sake ? sake.visitId : (opts.visitId || '') };

}

function saveEditor() {
  syncEditor();
  if (!_ed) return;
  var d = _ed.draft;
  if (!(d.name || '').trim()) { toast('이름을 입력해 주세요.'); return; }
  var payload = {
    category: catIdOf(d), name: d.name.trim(), brewery: (d.brewery || '').trim(), grade: d.grade || '',
    polish: num(d.polish), rice: (d.rice || '').trim(), hiire: d.hiire || '',
    vintage: num(d.vintage), age: num(d.age), cask: (d.cask || '').trim(),
    abv: num(d.abv), rating: Number(d.rating) || 0, memo: (d.memo || '').trim(),
    photo: d.photo || ''
  };
  if (_ed.id) {
    var s = sakeById(_ed.id);
    if (s) {
      Object.keys(payload).forEach(function (k) { s[k] = payload[k]; });
      s.visitId = _ed.visitId;
    }
  } else {
    payload.id = uid('s');
    payload.visitId = _ed.visitId;
    state.sakes.push(payload);
  }
  _ed = null;
  saveState();
  closeSheet();
  render();
  toast('저장했어요.');
}

/* =====================================================================
   업장 상세 — 날짜별 방문 타임라인 (0.6.0)
   ---------------------------------------------------------------------
   · 업장별 화면의 업장 줄을 누르면 그 업장의 방문을 날짜(최신순)로 펼친다.
   · 방문마다 그날 먹은 음식(사진·메모)과 마신 주류(주종 배지·이름·스타일·
     별점)를 한 화면에 모아 보여 준다. 날짜 줄은 방문 상세로, 주류 줄은
     주류 상세로 이어진다.
   · 원본 소스(sake-journal-src)는 건드리지 않고 build.py 가 이 파일을 덧붙인다.
   ===================================================================== */

/* 이 업장의 방문 — 같은 이름 업장은 하나로 보고 최신순으로 */
function venueVisits(venueId) {
  var key = _venueKey({ venueId: venueId });
  return state.visits.filter(function (v) {
    if (key && _venueKey(v) === key) return true;
    return v.venueId === venueId;
  }).sort(function (a, b) {
    var ka = (a.date || '') + ' ' + (a.time || '');
    var kb = (b.date || '') + ' ' + (b.time || '');
    return kb.localeCompare(ka);
  });
}

/* 그날 먹은 음식: 사진 썸네일 + 방문 메모 */
function venueFoodHtml(v) {
  var photos = v.photos || [];
  var h = '<div class="vsec">';
  h += '<div class="vseclabel">그날 먹은 음식</div>';
  if (photos.length) {

  _cloudMsg = { kind: ok ? 'ok' : 'error', text: text };
}
async function cloudDoAuth() {
  if (_cloudBusy) return;
  var email = String(_cloudForm.email || '').trim();
  var pw = String(_cloudForm.password || '');
  if (!cloudIsEmail(email)) { cloudNotice(false, '이메일 주소를 다시 확인해 주세요.'); cloudAuthSheet(_cloudTab); return; }
  if (pw.length < 6) { cloudNotice(false, '비밀번호는 6자 이상으로 정해 주세요.'); cloudAuthSheet(_cloudTab); return; }
  _cloudBusy = true;
  cloudNotice(false, '');
  _cloudMsg = { kind: 'ok', text: '처리 중...' };
  cloudAuthSheet(_cloudTab);
  try {
    if (_cloudTab === 'up') {
      var res = await cloudSignUp(email, pw);
      if (res.session) {
        _cloudMsg = null;
        closeSheetSilent();
        toast('가입 완료 · 클라우드에 저장합니다.');
        await cloudAfterLogin(true);
      } else {
        _cloudMsg = {
          kind: 'ok',
          text: res.exists
            ? '이미 가입된 이메일이에요. 로그인하거나 [이메일로 로그인]을 써 주세요.'
            : '확인 메일을 보냈어요. 메일의 링크를 누르면 로그인됩니다.'
        };
        _cloudLastEmail = email;
        cloudEmailSentSheet('확인 메일을 보냈어요.', email, 'signup');
      }
    } else {
      await cloudSignIn(email, pw);
      _cloudMsg = null;
      _cloudForm.password = '';
      closeSheetSilent();
      toast('로그인했어요 · ' + cloudEmail());
      await cloudAfterLogin(true);
    }
  } catch (e) {
    _cloudMsg = { kind: 'error', text: cloudAuthFailMessage(e) };
    cloudAuthSheet(_cloudTab);
  } finally {
    _cloudBusy = false;
    cloudUpdateBadge();
  }
}
function closeSheetSilent() {
  try { closeSheet(); } catch (e) { /* ignore */ }
}
var _cloudLastEmail = '';
/* '메일을 보냈어요' 안내 화면 */
function cloudEmailSentSheet(title, email, kind) {
  _cloudLastEmail = email || _cloudLastEmail;
  var h = sheetHead(title);
  h += '<div class="sheetbody"><div class="card">';
  h += '<p class="cloudsent">' + esc(email || '') + '</p>';
  h += '<p class="hint" style="margin:0 2px 10px">' + esc(
    kind === 'otp' ? '메일의 링크를 누르면 비밀번호 없이 로그인됩니다. 링크는 한 번만 쓸 수 있어요.'
      : kind === 'forgot' ? '메일의 링크를 누르면 새 비밀번호를 정하는 화면이 열립니다.'
        : '메일의 링크를 누르면 가입이 확인되고 로그인됩니다.') + '</p>';
  h += '<p class="hint" style="margin:0 2px 10px">메일이 안 보이면 스팸함도 확인해 주세요. 같은 메일을 너무 자주 보내면 잠시 제한될 수 있어요.</p>';
  h += '<button class="btn ghost block" data-act="cloud-close">닫기</button>';
  h += '</div></div>';
  openSheet(h);
  applyI18n();
}
async function cloudDoEmailSend(kind) {
  var email = String(_cloudForm.email || '').trim();
  if (!cloudIsEmail(email)) { cloudNotice(false, '이메일 주소를 다시 확인해 주세요.'); cloudEmailSheet(kind); return; }
  _cloudMsg = { kind: 'ok', text: '처리 중...' };
  cloudEmailSheet(kind);
  try {
    if (kind === 'forgot') await cloudSendReset(email);
    else if (kind === 'otp') await cloudSendOtp(email);
    else await cloudResendSignup(email);
    _cloudMsg = null;
    cloudEmailSentSheet(kind === 'forgot' ? '재설정 메일을 보냈어요'
      : kind === 'otp' ? '로그인 링크를 보냈어요' : '확인 메일을 다시 보냈어요', email, kind);
  } catch (e) {
    _cloudMsg = { kind: 'error', text: cloudAuthFailMessage(e) };
    cloudEmailSheet(kind);
  }
}
async function cloudDoResetSave() {
  var pw = String(_cloudForm.password || '');
  var pw2 = String(_cloudForm.password2 || '');
  if (pw.length < 6) { cloudNotice(false, '비밀번호는 6자 이상으로 정해 주세요.'); cloudResetSheet(); return; }
  if (pw !== pw2) { cloudNotice(false, '두 비밀번호가 서로 달라요.'); cloudResetSheet(); return; }
  _cloudMsg = { kind: 'ok', text: '저장 중...' };
  cloudResetSheet();
  try {
    await cloudUpdatePassword(pw);
    _cloudMsg = null;
    _cloudForm.password = '';
    _cloudForm.password2 = '';
    closeSheetSilent();
    toast('비밀번호를 바꿨어요 · 로그인됐습니다.');
    await cloudAfterLogin(true);
  } catch (e) {
    _cloudMsg = { kind: 'error', text: cloudAuthFailMessage(e) };
    cloudResetSheet();
  }
}
function cloudAuthFailMessage(e) {
  var c = (e && e.code) || '';
  var msg = (e && e.message) || '';
  if (c === 'invalid_credentials') return '이메일 또는 비밀번호가 맞지 않아요.';
  if (c === 'email_not_confirmed') return '이메일 확인이 아직 안 됐어요. 받은 메일의 링크를 누른 뒤 다시 로그인해 주세요.';
  if (c === 'user_already_exists' || c === 'email_exists') return '이미 가입된 이메일이에요. 로그인하거나 비밀번호 찾기를 써 주세요.';
  if (c === 'weak_password') return '비밀번호가 너무 짧아요. 6자 이상으로 정해 주세요.';
  if (c === 'over_email_send_rate_limit' || /rate limit/i.test(msg)) return '메일을 너무 자주 보냈어요. 조금 뒤에 다시 시도해 주세요.';
  if (c === 'validation_failed') return '이메일 주소를 다시 확인해 주세요.';
  if (c === 'signup_disabled') return '지금은 새 가입을 받지 않아요.';
  if (!e || !e.status) return '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  return '요청을 처리하지 못했어요: ' + (msg || '알 수 없는 오류');
}

/* 로그인 직후: 클라우드에 기록이 있으면 어느 쪽을 쓸지 묻고, 없으면 이 기기 기록을 올린다 */
async function cloudAfterLogin(showSettings) {
  cloudUpdateBadge();
  var tok = await cloudToken();
  if (!tok) return;
  var r = await cloudRemoteData(tok);
  if (!r.ok) {
    if (r.missing) { cloudSetStatus('setup'); }
    else cloudSetStatus('error', r.error || '');
    if (showSettings) openSettings(); else cloudRefreshSettings();
    return;
  }
  var localHas = cloudLocalHasRecords();
  if (r.empty) {
    if (localHas) {
      await cloudPush();
      toast('이 기기의 기록을 계정에 올렸어요.');
    } else {
      cloudSetStatus('idle');
    }
    if (showSettings) openSettings(); else cloudRefreshSettings();
    return;
  }
  var m = cloudMetaRead();
  m.email = cloudEmail();
  cloudMetaWrite();
  if (!localHas) {
    await cloudPull();
    toast('계정의 기록을 불러왔어요.');
    if (showSettings) openSettings(); else cloudRefreshSettings();
    return;
  }
  /* 양쪽에 기록이 있다 — 덮어쓰지 않고 고르게 한다 */
  m.lastRemote = r.updated;
  cloudMetaWrite();
  cloudSetStatus('idle');
  cloudConflictSheet(r.updated, !showSettings);
}
function cloudLocalHasRecords() {
  if (!state) return false;
  var real = (state.venues || []).filter(function (v) { return !v.sample; }).length +
    (state.visits || []).filter(function (v) { return !v.sample; }).length;
  return real > 0;
}
/* 클라우드 기록과 이 기기 기록이 다를 때 — 한쪽을 고르게 한다 */
function cloudConflictSheet(remoteUpdated, fromMismatch) {
  var h = sheetHead('어느 기록을 쓸까요?');
  h += '<div class="sheetbody"><div class="card">';
  h += '<p class="hint" style="margin:0 2px 10px">' + esc(
    fromMismatch
      ? '다른 기기에서 바뀐 기록이 있어요. 어느 쪽을 남길지 골라 주세요.'
      : '이 계정의 클라우드 기록과 이 기기의 기록이 모두 있습니다. 어느 쪽을 쓸지 골라 주세요.') + '</p>';
  h += '<p class="hint" style="margin:0 2px 10px">이 기기: 방문 ' + (state.visits || []).length + '건 · 주류 ' +
    (state.sakes || []).length + '병<br>' +
    (remoteUpdated ? '클라우드: ' + esc(fmtDot(String(remoteUpdated).slice(0, 10))) + '에 저장됨' : '') + '</p>';
  h += '<button class="btn primary block" data-act="cloud-take-remote">클라우드 기록 불러오기</button>';
  h += '<button class="btn block" data-act="cloud-take-local" style="margin-top:7px">이 기기 기록 올리기</button>';
  h += '<button class="btn ghost block" data-act="cloud-close" style="margin-top:7px">나중에</button>';
  h += '<p class="hint" style="margin:10px 2px 0">고르기 전에는 어느 쪽도 지우지 않아요.</p>';
  h += '</div></div>';

  applyI18n();
